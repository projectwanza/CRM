        '</div>' +
        '<h4 style="margin:20px 0 8px;font-size:13px;">Existing Payouts</h4>' +
        '<div class="table-scroll" id="payoutListBox"><div class="skeleton"></div></div>' +
      '</div>' +
    '</div></div>';

  onPayoutTypeChange();
  loadPayoutsList();
}

function onPayoutTypeChange(){
  const isPct = q('#payoutNewType').value === 'PERCENTAGE';
  q('#payoutNewValueLabel').textContent = isPct ? 'Percentage (%)' : 'Amount (₹)';
  q('#payoutNewBaseWrap').classList.toggle('hidden', !isPct);
}

function onPayoutSelectChange(){
  const val = q('#payoutSelect').value;
  if(val === '__new__'){
    CURRENT_PAYOUT_ID = null;
    CURRENT_PAYOUT_META = null;
    q('#payoutNewWrap').classList.remove('hidden');
    q('#payoutBillsSection').classList.add('hidden');
    return;
  }
  q('#payoutNewWrap').classList.add('hidden');
  if(!val){
    q('#payoutBillsSection').classList.add('hidden');
    return;
  }
  const p = PAYOUT_CACHE.filter(function(x){ return String(x.payoutId)===String(val); })[0];
  CURRENT_PAYOUT_ID = val;
  CURRENT_PAYOUT_META = p || null;
  q('#payoutBillsSection').classList.remove('hidden');
  loadPayoutBillsForSelection();
}

function submitNewPayout(){
  const payoutName = q('#payoutNewName').value.trim();
  if(!payoutName){ showToast('Enter Payout Name.', 'err'); return; }
  const calcType = q('#payoutNewType').value;
  const value = q('#payoutNewValue').value;
  if(!value){ showToast('Enter Amount/Percentage.', 'err'); return; }
  const data = {
    payoutName: payoutName,
    calcType: calcType,
    value: value,
    calcBase: q('#payoutNewBase').value,
    status: 'Active'
  };
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.success){ showToast(res.message || 'Failed to save payout.', 'err'); return; }
      showToast('Payout saved: '+payoutName, 'ok');
      CURRENT_PAYOUT_ID = res.payoutId;
      q('#payoutNewWrap').classList.add('hidden');
      q('#payoutBillsSection').classList.remove('hidden');
      loadPayoutsList(function(){
        q('#payoutSelect').value = res.payoutId;
        CURRENT_PAYOUT_META = PAYOUT_CACHE.filter(function(x){ return String(x.payoutId)===String(res.payoutId); })[0] || null;
        loadPayoutBillsForSelection();
      });
    })
    .withFailureHandler(function(){ showToast('Failed to save payout.', 'err'); })
    .apiAdminCreatePayout(ATOKEN, data);
}

function loadPayoutBillsForSelection(){
  if(!CURRENT_PAYOUT_ID) return;
  const filters = {
    dateFrom: q('#payoutBillFrom').value,
    dateTo: q('#payoutBillTo').value,
    billNo: q('#payoutBillNo').value,
    includeAlreadyPaid: q('#payoutIncludeAlreadyPaid').checked
  };
  q('#payoutBillsList').innerHTML = '<div class="skeleton"></div>';
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.success){ q('#payoutBillsList').innerHTML = '<div class="empty-state">'+esc(res.message||'Failed to load bills.')+'</div>'; return; }
      PAYOUT_BILLS_CACHE = res.bills;
      CURRENT_PAYOUT_META = res.payout;
      paintPayoutBillsList();
    })
    .withFailureHandler(function(){ q('#payoutBillsList').innerHTML = '<div class="empty-state">Failed to load bills.</div>'; })
    .apiAdminGetBillsForPayout(ATOKEN, CURRENT_PAYOUT_ID, filters);
}

function paintPayoutBillsList(){
  const host = q('#payoutBillsList');
  if(!host) return;
  if(!PAYOUT_BILLS_CACHE.length){ host.innerHTML = '<div class="empty-state">No eligible sale invoices.</div>'; updatePayoutSelectionSummary(); return; }
  host.innerHTML = '<table><thead><tr><th></th><th>Date</th><th>Party</th><th>Invoice</th><th>Sale Amount</th><th>P/L</th><th>Payout</th><th>Status</th></tr></thead><tbody>' +
    PAYOUT_BILLS_CACHE.map(function(b){
      return '<tr><td><input type="checkbox" class="payoutBillCb" value="'+esc(b.refNo)+'" onchange="updatePayoutSelectionSummary()"'+(b.alreadyPaid?' data-already-paid="1"':'')+'></td>' +
        '<td>'+esc(b.date)+'</td><td>'+esc(b.customerName)+'</td><td>#'+esc(b.refNo)+'</td>' +
        '<td>'+money(b.saleAmount)+'</td><td>'+money(b.billPL)+'</td><td>'+money(b.payoutAmount)+'</td>' +
        '<td>'+(b.alreadyPaid ? '<span style="color:var(--success)">✓ Payout</span>' : esc(b.paymentStatus||'Unpaid'))+'</td></tr>';
    }).join('') + '</tbody></table>';
  updatePayoutSelectionSummary();
}

function toggleAllPayoutBills(checked){
  Array.prototype.slice.call(document.querySelectorAll('.payoutBillCb')).forEach(function(cb){ cb.checked = checked; });
  updatePayoutSelectionSummary();
}

function getSelectedPayoutBills_(){
  const refs = Array.prototype.slice.call(document.querySelectorAll('.payoutBillCb:checked')).map(function(cb){ return cb.value; });
  return PAYOUT_BILLS_CACHE.filter(function(b){ return refs.indexOf(b.refNo) > -1; });
}

function updatePayoutSelectionSummary(){
  const selected = getSelectedPayoutBills_();
  const totalSale = selected.reduce(function(s,b){ return s+(b.saleAmount||0); }, 0);
  const totalPayout = selected.reduce(function(s,b){ return s+(b.payoutAmount||0); }, 0);
  const summaryEl = q('#payoutSelectedSummary');
  if(summaryEl) summaryEl.textContent = 'Selected: '+selected.length+' Bills | Total Sale: '+money(totalSale)+' | Total Payout: '+money(totalPayout);
  const btn = q('#givePayoutBtn');
  if(btn) btn.disabled = !selected.length;
}

function confirmGivePayout(){
  const selected = getSelectedPayoutBills_();
  if(!selected.length){ showToast('Select at least one invoice.', 'err'); return; }
  const totalPayout = selected.reduce(function(s,b){ return s+(b.payoutAmount||0); }, 0);
  if(!confirm('Pay '+money(totalPayout)+' for '+selected.length+' selected invoice(s)?')) return;

  const refNos = selected.map(function(b){ return b.refNo; });
  const allowDuplicate = q('#payoutIncludeAlreadyPaid').checked;
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.success){ showToast(res.message || 'Failed to give payout.', 'err'); return; }
      showToast('Payout of '+money(res.totalPaid)+' given for '+res.applied.length+' bill(s)'+(res.skipped.length ? (', '+res.skipped.length+' skipped (already paid)') : '')+'.', 'ok');
      loadPayoutBillsForSelection();
      applyAllTxnFilters(); // refreshes the Status column's Payout badge immediately
    })
    .withFailureHandler(function(){ showToast('Failed to give payout.', 'err'); })
    .apiAdminGivePayout(ATOKEN, CURRENT_PAYOUT_ID, refNos, allowDuplicate);
}

function loadPayoutsList(afterCb){
  google.script.run
    .withSuccessHandler(function(list){
      PAYOUT_CACHE = list;
      const sel = q('#payoutSelect');
      if(sel){
        const current = sel.value;
        sel.innerHTML = '<option value="">-- Select Payout --</option>' +
          list.map(function(p){
            const typeLabel = p.calcType==='PERCENTAGE' ? (p.value+'% of '+(p.calcBase==='PL'?'Total P/L':'Total Sale')) : money(p.value);
            return '<option value="'+esc(p.payoutId)+'">'+esc(p.payoutName)+' — '+esc(typeLabel)+'</option>';
          }).join('') +
          '<option value="__new__">+ Create New Payout</option>';
        sel.value = current;
      }
      const box = q('#payoutListBox');
      if(box){
        if(!list.length){ box.innerHTML = '<div class="empty-state">No payouts created yet.</div>'; }
        else {
          box.innerHTML = '<table><thead><tr><th>Name</th><th>Type</th><th>Based On</th><th>Status</th><th></th></tr></thead><tbody>' +
            list.slice().reverse().map(function(p){
              const isActive = String(p.status).toLowerCase() === 'active';
              return '<tr><td>'+esc(p.payoutName)+'</td>' +
                '<td>'+(p.calcType==='PERCENTAGE' ? (p.value+'%') : money(p.value))+'</td>' +
                '<td>'+(p.calcType==='PERCENTAGE' ? (p.calcBase==='PL'?'Total P/L':'Total Sale') : '—')+'</td>' +
                '<td><span class="badge">'+esc(p.status)+'</span></td>' +
                '<td style="white-space:nowrap"><a href="#" onclick="togglePayoutStatus(\''+esc(p.payoutId)+'\',\''+(isActive?'Inactive':'Active')+'\');return false;">'+(isActive?'Deactivate':'Activate')+'</a> &nbsp;' +
                '<a href="#" onclick="deletePayout(\''+esc(p.payoutId)+'\');return false;">Delete</a></td></tr>';
            }).join('') + '</tbody></table>';
        }
      }
      if(afterCb) afterCb();
    })
    .withFailureHandler(function(){})
    .apiAdminListPayouts(ATOKEN);
}

function togglePayoutStatus(payoutId, newStatus){
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.success){ showToast(res.message || 'Failed to update.', 'err'); return; }
      showToast('Payout ' + newStatus.toLowerCase() + 'd.', 'ok');
      loadPayoutsList();
    })
    .withFailureHandler(function(){ showToast('Failed to update payout.', 'err'); })
    .apiAdminSetPayoutStatus(ATOKEN, payoutId, newStatus);
}

function deletePayout(payoutId){
  if(!confirm('Delete this Payout? Historical payouts already given will NOT be removed.')) return;
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.success){ showToast(res.message || 'Failed to delete.', 'err'); return; }
      showToast('Payout deleted.', 'ok');
      loadPayoutsList();
    })
    .withFailureHandler(function(){ showToast('Failed to delete payout.', 'err'); })
    .apiAdminDeletePayout(ATOKEN, payoutId);
}

/* ---- Manage Payouts (Given) - read-only ledger of every payout ever given ---- */
function openManagePayoutsModal(){
  q('#modalHost').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal" style="max-width:900px">' +
      '<div class="modal-head"><h3>Manage Payouts (Given)</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
      '<div class="modal-body"><div class="table-scroll" style="max-height:420px" id="managePayoutsBox"><div class="skeleton"></div></div></div>' +
    '</div></div>';

function getSelectedPayoutPageBills_(){
  const keys = Array.prototype.slice.call(document.querySelectorAll('.poBillCb:checked')).map(function(cb){ return cb.value; });
  return PAYOUT_PAGE_BILLS.filter(function(b){ return keys.indexOf(b.rowKey) > -1; }); // NEW - rowKey, not refNo (Credit Note rows need this)
}

// NEW: "give at X%" amount for one bill - handles Credit Note debit lines
// (both payoutAmount and remainingPayout are <=0 there) by capping the
// MAGNITUDE of the debit, instead of Math.min() which would pick the
// MORE negative number (wrong direction for a debit).
function payoutGiveAmountAtPct_(b, pct){
  const target = (b.payoutAmount||0) * pct / 100;
  if(b.isCreditNote){
    return (Math.abs(target) < Math.abs(b.remainingPayout||0)) ? target : (b.remainingPayout||0);
  }
  return Math.min(b.remainingPayout||0, target);
}

function updatePayoutPageSelectionSummary(){
  const selected = getSelectedPayoutPageBills_();
  const pct = Number(q('#poGivePercent') ? q('#poGivePercent').value : 100) || 100;
  const totalSale = selected.reduce(function(s,b){ return s+(b.saleAmount||0); }, 0);
  const totalToGive = selected.reduce(function(s,b){ return s + payoutGiveAmountAtPct_(b, pct); }, 0);
  // NEW: breakdown by the invoice's OWN Payment Status among the selected
  // bills, so it's clear at a glance how many are still Unpaid/Partial vs
  // Fully Paid - and how many/how much is a Credit Note debit.
  let unpaidCount=0, partialCount=0, paidCount=0, cnCount=0, cnAmount=0;
  selected.forEach(function(b){
    if(b.isCreditNote){ cnCount++; cnAmount += (b.saleAmount||0); return; }
    if(b.reportStatus==='Unpaid') unpaidCount++;
    else if(b.reportStatus==='Partially Paid') partialCount++;
    else paidCount++;
  });
  const summaryEl = q('#poSelectedSummary');
  if(summaryEl){
    let txt = 'Selected: '+selected.length+' Bills | Total Sale: '+money(totalSale)+' | Total to Give @ '+pct+'%: '+money(totalToGive);
    txt += ' &nbsp;|&nbsp; 🔴 Unpaid: '+unpaidCount+' &nbsp;·&nbsp; 🟡 Partial: '+partialCount+' &nbsp;·&nbsp; 🟢 Paid: '+paidCount;
    if(cnCount) txt += ' &nbsp;|&nbsp; 🟣 Credit Note: '+cnCount+' (Amount: '+money(cnAmount)+')';
    summaryEl.innerHTML = txt;
  }
  const btn = q('#poGivePayoutBtn');
  if(btn) btn.disabled = !selected.length;
}

function givePayoutFromPage(){
  const selected = getSelectedPayoutPageBills_();
  if(!selected.length){ showToast('Select at least one invoice.', 'err'); return; }
  const pct = Number(q('#poGivePercent').value) || 100;
  const totalToGive = selected.reduce(function(s,b){ return s + payoutGiveAmountAtPct_(b, pct); }, 0); // NEW - handles Credit Note debit correctly
  if(!confirm('Give '+money(totalToGive)+' ('+pct+'% of payout) for '+selected.length+' selected invoice(s)?')) return;

  const refNos = selected.map(function(b){ return b.refNo; });
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.success){ showToast(res.message || 'Failed to give payout.', 'err'); return; }
      showToast('Payout of '+money(res.totalPaid)+' given for '+res.applied.length+' bill(s)'+(res.skipped.length ? (', '+res.skipped.length+' skipped') : '')+'.', 'ok');
      loadPayoutPageBills();
    })
    .withFailureHandler(function(){ showToast('Failed to give payout.', 'err'); })
    .apiAdminGivePayoutWithPercent(ATOKEN, PAYOUT_PAGE_CURRENT_ID, refNos, pct);
}

// ============ NEW: Grouped "Manage Payout" record view ============
// Groups the SAME apiAdminListAppliedPayouts() rows (untouched API) by
// Payout + Customer + Payout Date, so each row on screen = one "payout
// record" (matches how a Give Payout action is actually given). Click
// row -> Bill-wise -> click bill -> Item-wise (apiAdminGetItemsForInvoice,
// also untouched). Nothing here writes to any sheet - read-only + export.

function buildPayoutGroups_(list){
  const groups = {};
  const order = [];
  (list||[]).forEach(function(r){
    const key = r.payoutId+'|'+r.customerId+'|'+r.payoutDate;
    if(!groups[key]){
      groups[key] = {
        key: key, payoutId: r.payoutId, payoutName: r.payoutName,
        calcType: r.calcType, value: r.value, calcBase: r.calcBase,
        customerId: r.customerId, customerName: r.customerName,
        payoutDate: r.payoutDate, dateRaw: r.dateRaw,
        bills: [], totalSale: 0, totalPayout: 0
      };
      order.push(key);
    }
    const g = groups[key];
    g.bills.push(r);
    g.totalSale += (Number(r.saleAmount)||0);
    g.totalPayout += (Number(r.payoutAmount)||0);
  });
  return order.map(function(k){ return groups[k]; });
}

// Converts existing "dd MMM yyyy" display date (from formatDate_ on the
// server - UNCHANGED everywhere else) into DD-MM-YYYY ONLY for this new
// screen, exactly as requested. Server-side date format is not touched.
function toDDMMYYYY_(s){
  if(!s) return '';
  const d = new Date(s);
  if(isNaN(d.getTime())) return s;
  const dd = ('0'+d.getDate()).slice(-2);
  const mm = ('0'+(d.getMonth()+1)).slice(-2);
  return dd+'-'+mm+'-'+d.getFullYear();
}

// ---- CSV export helpers (pure client-side, no server change needed) ----
function downloadCsv_(filename, headers, rows){
  const cell = function(v){ return '"'+String(v===null||v===undefined?'':v).replace(/"/g,'""')+'"'; };
  const csv = [headers.map(cell).join(',')].concat(
    rows.map(function(r){ return r.map(cell).join(','); })
  ).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

// Shared - used by the accordion AND the exports, so exported
// files always match exactly what's currently visible/filtered on screen.
function getFilteredDueBills_(){
  const custTerm = (q('#dbSearchCustomer')?q('#dbSearchCustomer').value:'').toLowerCase();
  const billTerm = (q('#dbSearchBillNo')?q('#dbSearchBillNo').value:'').toLowerCase();
  const from = q('#dbFrom')?q('#dbFrom').value:'';
  const to = q('#dbTo')?q('#dbTo').value:'';
  const fromTime = from ? new Date(from).getTime() : null;
  const toTime = to ? (new Date(to).getTime() + 24*60*60*1000 - 1) : null;
  const status = q('#dbStatus')?q('#dbStatus').value:'';
  const customerKey = q('#dbCustomerFilter')?q('#dbCustomerFilter').value:'';
  const sort = q('#dbSort')?q('#dbSort').value:'date_desc';

  let list = (DUE_BILLS_CACHE.bills||[]).filter(function(b){
    if(custTerm && String(b.customerName||'').toLowerCase().indexOf(custTerm)===-1) return false;
    if(billTerm && String(b.refNo||'').toLowerCase().indexOf(billTerm)===-1) return false;
    if(fromTime && (!b.dateRaw || b.dateRaw < fromTime)) return false;
    if(toTime && (!b.dateRaw || b.dateRaw > toTime)) return false;
    if(status && b.paymentStatus !== status) return false;
    if(customerKey && dueBillGroupKey_(b.customerId, b.customerName) !== customerKey) return false;
    return true;
  });

  list = list.slice().sort(function(a,b){
    if(sort==='date_asc') return (a.dateRaw||0)-(b.dateRaw||0);
    if(sort==='due_desc') return (b.dueAmount||0)-(a.dueAmount||0);
    if(sort==='due_asc') return (a.dueAmount||0)-(b.dueAmount||0);
    return (b.dateRaw||0)-(a.dateRaw||0); // date_desc default
  });
  return list;
}

// NEW: many bills have a blank customerId (walk-in / unlinked customers).
// Mirrors the exact fallback key the server uses in apiAdminGetDueBills
// (customerId, else 'NAME::'+uppercased name) so bills group the same
// way here as they do in the server's customerSummary.
function dueBillGroupKey_(customerId, customerName){
  return customerId ? String(customerId) : ('NAME::' + String(customerName||'').toUpperCase());
}

// NEW: groups the currently-filtered bills by customer, preserving the
// server's customerSummary order (falls back to first-seen order for
// any customer not in that list).
function groupFilteredDueBillsByCustomer_(){
  const filtered = getFilteredDueBills_();
  const map = {};
  const seenOrder = [];
  filtered.forEach(function(b){
    const key = dueBillGroupKey_(b.customerId, b.customerName);
    if(!map[key]){
      map[key] = { key: key, customerId: b.customerId||'', customerName: b.customerName, bills: [], totalDue: 0 };
      seenOrder.push(key);
    }
    map[key].bills.push(b);
    map[key].totalDue += (b.dueAmount||0);
  });
  const summaryOrder = (DUE_BILLS_CACHE.customerSummary||[]).map(function(c){ return dueBillGroupKey_(c.customerId, c.customerName); });
  const order = summaryOrder.filter(function(key){ return map[key]; });
  seenOrder.forEach(function(key){ if(order.indexOf(key)===-1) order.push(key); });
  return order.map(function(key){ return map[key]; });
}

// NEW: generic multi-sheet Excel (.xlsx) writer, built on the SheetJS
// library loaded in <head>. sheets = [{name, headers, rows}, ...].
function downloadXlsx_(filename, sheets){
  if(typeof XLSX === 'undefined'){ showToast('Excel export library failed to load - check your internet connection.', 'err'); return; }
  const wb = XLSX.utils.book_new();
  sheets.forEach(function(s){
    const ws = XLSX.utils.aoa_to_sheet([s.headers].concat(s.rows));
    XLSX.utils.book_append_sheet(wb, ws, s.name.substring(0,31)); // Excel sheet-name limit
  });
  XLSX.writeFile(wb, filename);
}

// repeated per customer. Used by BOTH CSV and Excel export so they match.
function dueBillsGroupedRowsForExport_(){
  const groups = groupFilteredDueBillsByCustomer_();
  const rows = [];
  groups.forEach(function(c, idx){
    if(idx>0) rows.push([]);
    rows.push(['Customer:', c.customerName]);
    rows.push(['Total Due:', c.totalDue]);
    rows.push(DUE_BILLS_BILL_HEADERS_.slice());
    c.bills.forEach(function(b){
      rows.push(['#'+b.refNo, b.date, b.billAmount, b.paidAmount, b.dueAmount, b.paymentStatus, b.description||'']);
    });
  });
  return rows;
}

function exportDueBillsCsv(){
  downloadCsv_('Due_Bills.csv', ['Due Bills - Customer-wise Export'], dueBillsGroupedRowsForExport_());
}
function exportDueBillsXlsx(){
  downloadXlsx_('Due_Bills.xlsx', [
    { name: 'Due Bills', headers: [], rows: dueBillsGroupedRowsForExport_() }
  ]);
}

function loadManageExpensesList(){
  google.script.run
    .withSuccessHandler(function(list){
      MANAGE_EXP_CACHE = list;
      paintManageExpFilterOptions_();
      paintManageExpensesList();
    })
    .withFailureHandler(function(){ q('#mgList').innerHTML = '<div class="empty-state">Failed to load.</div>'; })
    .apiAdminListAppliedExpenses(ATOKEN);
}

function paintManageExpFilterOptions_(){
  const custSel = q('#mgCustomer'), catSel = q('#mgCategory');
  if(!custSel || !catSel) return;
  const custSeen = {}, cats = [], custs = [];
  MANAGE_EXP_CACHE.forEach(function(e){
    const cid = String(e.customerId||'');
    if(cid && !custSeen[cid]){ custSeen[cid] = true; custs.push({id: cid, name: e.customerName}); }
  });
  const catSeen = {};
  MANAGE_EXP_CACHE.forEach(function(e){
    const c = String(e.category||'').trim();
    if(c && !catSeen[c.toUpperCase()]){ catSeen[c.toUpperCase()] = true; cats.push(c); }
  });
  custSel.innerHTML = '<option value="">All Customers</option>' + custs.map(function(c){ return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'; }).join('');
  catSel.innerHTML = '<option value="">All Categories</option>' + cats.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join('');
}

function paintManageExpensesList(){
  const host = q('#mgList');
  if(!host) return;
  const from = q('#mgFrom').value, to = q('#mgTo').value;
  const fromTime = from ? new Date(from).getTime() : null;
  const toTime = to ? (new Date(to).getTime() + 24*60*60*1000 - 1) : null;
  const customerId = q('#mgCustomer').value;
  const category = q('#mgCategory').value.toUpperCase();
  const calcType = q('#mgCalcType').value;
  const status = q('#mgStatus').value;
  const billNoTerm = q('#mgBillNo').value.toLowerCase();
  const term = q('#mgSearch').value.toLowerCase();

  const list = MANAGE_EXP_CACHE.filter(function(e){
    if(fromTime && (!e.dateRaw || e.dateRaw < fromTime)) return false;
    if(toTime && (!e.dateRaw || e.dateRaw > toTime)) return false;
    if(customerId && String(e.customerId||'') !== customerId) return false;
    if(category && String(e.category||'').toUpperCase() !== category) return false;
    if(calcType && String(e.calcType||'').toUpperCase() !== calcType) return false;
    if(status && String(e.status||'').toLowerCase() !== status.toLowerCase()) return false;
    if(billNoTerm && String(e.billRefNo||'').toLowerCase().indexOf(billNoTerm)===-1) return false;
    if(term && String(e.customerName||'').toLowerCase().indexOf(term)===-1 && String(e.ruleName||'').toLowerCase().indexOf(term)===-1) return false;
    return true;
  });

  if(!list.length){ host.innerHTML = '<div class="empty-state">No applied expenses found.</div>'; return; }
  host.innerHTML = '<table><thead><tr><th></th><th>Date</th><th>Customer</th><th>Bill No</th><th>Sale</th><th>Expense</th><th>Rule</th></tr></thead><tbody>' +
    list.map(function(e){
      return '<tr><td><input type="checkbox" class="mgCb" value="'+e.rowNumber+'"></td>' +
        '<td>'+esc(e.date)+'</td><td>'+esc(e.customerName)+'</td><td>#'+esc(e.billRefNo)+'</td>' +
        '<td>'+money(e.saleAmount)+'</td><td>'+money(e.expenseAmount)+'</td>' +
        '<td>'+esc(e.ruleName)+' ('+(e.calcType==='PERCENTAGE'?(e.value+'%'):money(e.value))+')</td></tr>';
    }).join('') + '</tbody></table>';
}

function removeSelectedAppliedExpenses(){

  google.script.run

}

function submitCreateItem(force){
  const data = {
    itemName: q('#ciName').value.trim(),
    itemCode: q('#ciCode').value.trim(),
    hsnSac: q('#ciHsn').value.trim(),
    openingQty: q('#ciOpening').value,
    purchaseQty: q('#ciPurchase').value,
    itemValue: q('#ciValue').value,
    force: !!force
  };
  if(!data.itemName){ showToast('Item name is required.','err'); return; }
  google.script.run
    .withSuccessHandler(function(res){
      if(res.success){ showToast('Product created: ID '+res.itemId,'ok'); closeModal(); loadItems(); loadItemDashboard(); }
      else if(res.duplicate){ showDupeWarning(res.matches, data); }
      else showToast(res.message||'Failed to create product.','err');
    })
    .withFailureHandler(function(){ showToast('Failed to create product.','err'); })
    .apiAdminCreateItem(ATOKEN, data);

function fpeRenderDropdown(dd, results){
  if(!results || !results.length){ dd.style.display='none'; dd.innerHTML=''; dd._items=[]; return; }
  dd._items = results;
  dd._highlight = -1;
  dd.innerHTML = results.map(function(r,i){
    return '<div class="fpeSuggestion" data-i="'+i+'" style="padding:8px 12px;font-size:13px;cursor:pointer" onmousedown="fpeSelectItem(this.closest(\'td\').querySelector(\'.fpeItemName\'), \''+esc(r.itemId)+'\', \''+esc(r.itemName).replace(/\'/g,"\\'")+'\')">'+esc(r.itemName)+'</div>';
  }).join('');
  dd.style.display = '';
}

function fpeHighlightDropdown(dd){
  Array.prototype.forEach.call(dd.children, function(el,i){
    el.style.background = (i===dd._highlight) ? 'var(--neutral-bg)' : '';
  });
}

function fpeItemKeydown(event, inputEl){
  const dd = inputEl.parentElement.querySelector('.fpeDropdown');
  if(!dd || dd.style.display==='none' || !dd._items || !dd._items.length) return; // free-typed new name - default Tab/Enter behavior
  const items = dd._items;
  if(event.key === 'ArrowDown'){
    event.preventDefault();
    dd._highlight = Math.min((dd._highlight===undefined?-1:dd._highlight)+1, items.length-1);
    fpeHighlightDropdown(dd);
  } else if(event.key === 'ArrowUp'){
    event.preventDefault();
    dd._highlight = Math.max((dd._highlight===undefined?0:dd._highlight)-1, 0);
    fpeHighlightDropdown(dd);
  } else if(event.key === 'Enter' || event.key === 'Tab'){
    if(dd._highlight !== undefined && dd._highlight > -1){
      event.preventDefault();
      const r = items[dd._highlight];
      fpeSelectItem(inputEl, r.itemId, r.itemName);
    }
  } else if(event.key === 'Escape'){
    dd.style.display = 'none';
  }
}

function fpeSelectItem(inputEl, itemId, itemName){

/* ---- live calculation (same formula/rounding as the backend) ---- */
function fpeRecalcAll(){
  const rows = Array.prototype.slice.call(document.querySelectorAll('#fpeProductBody tr'));
  const data = rows.map(function(row){
    const cost = Number(row.querySelector('.fpeCost').value) || 0;
    const qty = Number(row.querySelector('.fpeQty').value) || 0;
    return { row: row, cost: cost, qty: qty, value: cost * qty };
  });
  const totalValue = data.reduce(function(s,d){ return s + d.value; }, 0);

  let totalExpense = 0;
  if(q('#fpeAddExpense') && q('#fpeAddExpense').checked){
    Array.prototype.slice.call(document.querySelectorAll('#fpeExpenseBody tr')).forEach(function(row){
      totalExpense += Number(row.querySelector('.fpeExpAmount').value) || 0;
    });
  }

  let allocatedSum = 0;
  data.forEach(function(d, idx){
    let allocated = totalValue > 0 ? (d.value / totalValue) * totalExpense : 0;
    allocated = Math.round(allocated * 100) / 100;
    if(idx === data.length - 1) allocated = Math.round((totalExpense - allocatedSum) * 100) / 100; // remainder to last row
    allocatedSum += allocated;
    const landed = d.value + allocated;
    const perUnit = d.qty > 0 ? landed / d.qty : 0;
    d.row.querySelector('.fpeValueCell').textContent = money(d.value);
    d.row.querySelector('.fpeExpCell').textContent = money(allocated);
    d.row.querySelector('.fpeLandedCell').textContent = money(landed);
    d.row.querySelector('.fpePerUnitCell').textContent = money(perUnit);
  });

  const totalsRow = q('#fpeTotalsRow');
  if(totalsRow){
    totalsRow.querySelector('.fpeTotalValue').textContent = money(totalValue);
    totalsRow.querySelector('.fpeTotalExpense').textContent = money(totalExpense);
    totalsRow.querySelector('.fpeTotalLanded').textContent = money(totalValue + totalExpense);
  }
}

// NEW: pulled out into its own function so the error state's "Retry"
// button can call it again without re-opening the whole modal.
function loadPurchaseHistoryList(){
  const host = q('#phBody');
  if(host) host.innerHTML = '<div class="skeleton"></div>';
  google.script.run
    .withSuccessHandler(function(res){
      if(!res || !res.success){
        console.error('apiAdminGetAllPurchaseHistory returned failure:', res); // NEW: check DevTools console (F12) for the real reason
        PURCHASE_HISTORY_CACHE = [];
        paintPurchaseHistoryError_((res && res.message) || 'Could not load purchase history. (Check browser console for details.)');
        return;
      }
      PURCHASE_HISTORY_CACHE = res.history || [];
      paintPurchaseHistoryList();
    })
    // BEFORE: only a toast on failure - #phBody was left showing its
    // loading skeleton forever if this ever fired, which is exactly why
    // the popup looked like it never loaded. Now the body itself shows
    // a clear, actionable error with a Retry button, AND the raw error
    // is logged to the browser console (F12 -> Console) for diagnosis.
    .withFailureHandler(function(err){
      console.error('apiAdminGetAllPurchaseHistory failed:', err); // NEW
      PURCHASE_HISTORY_CACHE = [];
      paintPurchaseHistoryError_((err && err.message) || 'Could not load purchase history. (Check browser console for details.)');
    })
    .apiAdminGetAllPurchaseHistory(ATOKEN);
}

function paintPurchaseHistoryError_(message){
  const host = q('#phBody');
  if(!host) return;
  host.innerHTML =
    '<div style="text-align:center;padding:24px 12px;color:var(--text-3)">' +
      '<div style="margin-bottom:10px">'+esc(message)+'</div>' +
      '<button class="btn btn-ghost" onclick="loadPurchaseHistoryList()">Retry</button>' +
    '</div>';
}

function paintPurchaseHistoryList(){
  const host = q('#phBody');
  if(!host) return;
  try {
    const term = (q('#phSearch') ? q('#phSearch').value.trim().toLowerCase() : '');
    const list = term ? PURCHASE_HISTORY_CACHE.filter(function(h){ return String(h && h.itemName || '').toLowerCase().indexOf(term) > -1; }) : PURCHASE_HISTORY_CACHE;
    if(!list.length){ host.innerHTML = '<p style="color:var(--text-3);text-align:center;padding:20px">No purchase entries found.</p>'; return; }
    host.innerHTML = '<table><thead><tr><th>Date</th><th>Item</th><th>Qty</th><th>Cost</th><th>Value</th><th>Expense</th><th>Per Unit</th><th>Note</th></tr></thead><tbody>' +
      list.map(function(h){
        h = h || {};
        return '<tr><td>'+esc(h.date)+'</td><td>'+esc(h.itemName)+'</td><td>'+esc(h.qty)+'</td><td>'+money(h.rate)+'</td><td>'+money(h.amount)+'</td>' +
          '<td>'+money(h.allocatedExpense)+'</td><td>'+money(h.landedCostPerUnit || h.rate)+'</td><td>'+esc(h.note||'-')+'</td></tr>';
      }).join('') + '</tbody></table>';
  } catch(e){
    // NEW: a rendering bug used to leave the loading skeleton on screen
    // forever with zero indication anything went wrong - now it surfaces
    // as a normal, retry-able error instead of a silent stuck popup.
    paintPurchaseHistoryError_('Something went wrong while displaying purchase history.');
  }
}

function submitFastPurchaseEntry(){
  const date = q('#fpeDate').value;
  if(!date){ showToast('Pick a date.', 'err'); return; }

  const products = [];
  Array.prototype.slice.call(document.querySelectorAll('#fpeProductBody tr')).forEach(function(row){
    const name = row.querySelector('.fpeItemName').value.trim();
    const cost = Number(row.querySelector('.fpeCost').value) || 0;
    const qty = Number(row.querySelector('.fpeQty').value) || 0;
    if(name && qty > 0) products.push({ itemName: name, cost: cost, qty: qty });
  });
  if(!products.length){ showToast('Add at least one product (Name + Qty).', 'err'); return; }

  const expenses = [];
  if(q('#fpeAddExpense').checked){
    Array.prototype.slice.call(document.querySelectorAll('#fpeExpenseBody tr')).forEach(function(row){
      const name = row.querySelector('.fpeExpName').value.trim();
      const amount = Number(row.querySelector('.fpeExpAmount').value) || 0;
      if(name && amount > 0) expenses.push({ name: name, amount: amount });
    });
  }

  google.script.run
    .withSuccessHandler(function(res){
      if(!res.success){ showToast(res.message || 'Failed to save.', 'err'); return; }
      showToast(res.results.length + ' product(s) saved.', 'ok');
      fpeShowSummary(res);
      loadItems(); loadItemDashboard();
    })
    .withFailureHandler(function(){ showToast('Failed to save purchase entry.', 'err'); })
    .apiAdminSaveFastPurchaseEntry(ATOKEN, { date: date, products: products, expenses: expenses });
}

function fpeShowSummary(res){
  const host = q('#fpeSummary');
  if(!host) return;
  host.innerHTML = '<table style="width:100%;font-size:12.5px"><thead><tr><th>Item</th><th>Qty</th><th>Cost</th><th>Purchase Value</th><th>Expense</th><th>Landed Cost</th><th>Per Unit</th></tr></thead><tbody>' +
    res.results.map(function(r){
      return '<tr><td>'+esc(r.itemName)+(r.isNewItem?' <span style="color:var(--success);font-weight:600">(new)</span>':'')+'</td><td>'+esc(r.qty)+'</td><td>'+money(r.cost)+'</td>' +
        '<td>'+money(r.purchaseValue)+'</td><td>'+money(r.allocatedExpense)+'</td><td>'+money(r.landedCost)+'</td><td>'+money(r.landedCostPerUnit)+'</td></tr>';
    }).join('') + '</tbody></table>' +
    '<p style="margin-top:8px">Total Purchase Value: '+money(res.totalPurchaseValue)+' &nbsp;|&nbsp; Total Expense: '+money(res.totalExpense)+'</p>';
}

/* ---- Link Items: multi-select picker for ONE product ---- */
function openLinkItemsModal(itemId, itemName){
  q('#modalHost').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal" style="max-width:640px">' +
      '<div class="modal-head"><h3>Link Items to: '+esc(itemName)+'</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
      '<div class="modal-body">' +
        '<input type="text" id="linkItemsSearch" placeholder="Search Item Details names..." style="width:100%;margin-bottom:10px;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px" oninput="paintLinkItemsList()">' +
        '<div class="table-scroll" style="max-height:340px" id="linkItemsList"><div class="skeleton"></div></div>' +
      '</div>' +
      '<div class="modal-actions"><button class="btn btn-primary" style="flex:1" onclick="submitLinkItems(\''+esc(itemId)+'\')">Link Selected</button><button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancel</button></div>' +
    '</div></div>';

  window._linkItemsTargetId = itemId;
  google.script.run
    .withSuccessHandler(function(list){ ALL_SALE_NAMES_CACHE = list; paintLinkItemsList(); })
    .withFailureHandler(function(){ showToast('Failed to load Item Names.','err'); })
    .apiAdminListAllSaleNames(ATOKEN);
}

let ALL_SALE_NAMES_CACHE = [];

function paintLinkItemsList(){
  const host = q('#linkItemsList');
  if(!host) return;
  const term = (q('#linkItemsSearch') ? q('#linkItemsSearch').value : '').toLowerCase();
  const targetId = window._linkItemsTargetId;
  const rows = ALL_SALE_NAMES_CACHE.filter(function(n){ return !term || String(n.name).toLowerCase().indexOf(term)>-1; });

  if(!rows.length){ host.innerHTML = '<p style="color:var(--text-3)">No matching Item Names.</p>'; return; }

  host.innerHTML = '<table><tbody>' + rows.map(function(n){
    const isThis = String(n.linkedTo) === String(targetId);
    const isOther = n.linkedTo && !isThis;
    const label = isThis ? ' (already linked to this product)' : isOther ? (' (linked to '+esc(n.linkedToName)+')') : '';
    return '<tr><td style="width:24px"><input type="checkbox" value="'+esc(n.name)+'" class="linkItemCb" '+(isThis||isOther?'disabled':'')+'></td>' +
      '<td>'+esc(n.name)+'<span style="color:var(--text-3);font-size:11px">'+label+' — qty '+esc(n.totalQty)+'</span></td></tr>';
  }).join('') + '</tbody></table>';
}

function submitLinkItems(itemId){
  const names = Array.prototype.slice.call(document.querySelectorAll('.linkItemCb:checked')).map(function(cb){ return cb.value; });
  if(!names.length){ showToast('Select at least one Item Name.', 'err'); return; }
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.success){ showToast(res.message || 'Failed to link.', 'err'); return; }
      showToast(res.linked.length + ' linked' + (res.skipped.length ? (', ' + res.skipped.length + ' skipped') : '') + '.', 'ok');
      closeModal();
      loadItems();
      loadItemDashboard();
    })
    .withFailureHandler(function(){ showToast('Failed to link.', 'err'); })
    .apiAdminBulkLinkItems(ATOKEN, itemId, names);
}

/* ---- unlinked sale names (Section D: manual linking) ---- */
function openUnlinkedNames(){
  q('#modalHost').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal" style="max-width:640px">' +
      '<div class="modal-head"><h3>Unlinked Sale Names</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
      '<div class="modal-body">' +
        '<div id="unlinkedBody"><div class="skeleton" style="height:160px"></div></div>' +
        '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">' +
          '<label style="font-size:12px;font-weight:600">Link selected names to:</label>' +
          '<input id="ulTargetSearch" placeholder="Search master product..." style="width:100%;margin-top:6px;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px" oninput="searchLinkCandidates(this.value)">' +
          '<div id="ulTargetResults" style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"></div>' +
        '</div>' +
      '</div>' +
      '<div class="modal-actions"><button class="btn btn-primary" style="flex:1" onclick="submitUnlinkedBulkLink()">Link Selected</button><button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancel</button></div>' +
    '</div></div>';

  window._ulTargetId = null;
  google.script.run
    .withSuccessHandler(function(list){
      const body = q('#unlinkedBody');
      if(!list.length){ body.innerHTML = '<p style="color:var(--text-3)">Every sale name in Item Details is already linked to a master product.</p>'; return; }
      body.innerHTML = '<table><tbody>' + list.map(function(u){
        return '<tr><td style="width:24px"><input type="checkbox" value="'+esc(u.name)+'" class="ulCb"></td>' +
          '<td>'+esc(u.name)+'<div style="font-size:11px;color:var(--text-3)">'+esc(u.count)+' transaction(s), '+esc(u.totalQty)+' total qty</div></td></tr>';
      }).join('') + '</tbody></table>';
    })
    .withFailureHandler(function(){ showToast('Failed to load unlinked names.','err'); })
    .apiAdminGetUnlinkedSaleNames(ATOKEN);
}

function searchLinkCandidates(query){
  google.script.run
    .withSuccessHandler(function(results){
      const host = q('#ulTargetResults');
      if(!host) return;
      host.innerHTML = results.map(function(r){
        return '<button class="btn btn-ghost" style="font-size:12px;padding:5px 10px" onclick="pickUlTarget(\''+esc(r.itemId)+'\',\''+esc(r.itemName).replace(/\'/g,"\\'")+'\')">'+esc(r.itemName)+'</button>';
      }).join('');
    })
    .withFailureHandler(function(){})
    .apiAdminSearchItemsForLink(ATOKEN, query);
}

function pickUlTarget(itemId, itemName){
  window._ulTargetId = itemId;
  q('#ulTargetSearch').value = itemName;
  q('#ulTargetResults').innerHTML = '';
}

function submitUnlinkedBulkLink(){
  if(!window._ulTargetId){ showToast('Pick a master product to link to.', 'err'); return; }
  const names = Array.prototype.slice.call(document.querySelectorAll('.ulCb:checked')).map(function(cb){ return cb.value; });
  if(!names.length){ showToast('Select at least one Item Name.', 'err'); return; }
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.success){ showToast(res.message || 'Failed to link.', 'err'); return; }
      showToast(res.linked.length + ' linked' + (res.skipped.length ? (', ' + res.skipped.length + ' skipped') : '') + '.', 'ok');
      openUnlinkedNames();
      loadItems();
      loadItemDashboard();
    })
    .withFailureHandler(function(){ showToast('Failed to link.', 'err'); })
    .apiAdminBulkLinkItems(ATOKEN, window._ulTargetId, names);
}
 
/* ---- merge products ---- */
function openMergeProducts(){
  q('#modalHost').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal">' +
      '<div class="modal-head"><h3>Merge Products</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
      '<div class="modal-body">' +
        '<div class="field"><label>Product to merge (will be deactivated)</label><input id="mpSource" placeholder="Type to search..." oninput="searchMergePicker(\'mpSource\')"><div id="mpSourceResults"></div></div>' +
        '<div class="field"><label>Merge into (kept as the master)</label><input id="mpTarget" placeholder="Type to search..." oninput="searchMergePicker(\'mpTarget\')"><div id="mpTargetResults"></div></div>' +
        '<p style="font-size:12px;color:var(--text-2)">All alternate names and historical transactions of the source product move to the target. Stock is combined. The source is deactivated, not deleted.</p>' +
      '</div>' +
      '<div class="modal-actions"><button class="btn btn-primary" style="flex:1" onclick="submitMerge()">Merge</button><button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancel</button></div>' +
    '</div></div>';
  window._mergeSourceId = null; window._mergeTargetId = null;
}
 
function searchMergePicker(fieldId){
  const query = q('#'+fieldId).value;
  google.script.run
    .withSuccessHandler(function(results){
      const host = q('#'+fieldId+'Results');
      host.innerHTML = results.map(function(r){
        return '<button class="btn btn-ghost" style="font-size:12px;padding:5px 10px;margin:4px 4px 0 0" onclick="pickMerge(\''+fieldId+'\',\''+esc(r.itemId)+'\',\''+esc(r.itemName).replace(/'/g,"\\'")+'\')">'+esc(r.itemName)+' (ID '+esc(r.itemId)+')</button>';
      }).join('');
    })
    .withFailureHandler(function(){})
    .apiAdminSearchItemsForLink(ATOKEN, query);
}
 
function pickMerge(fieldId, itemId, itemName){
  q('#'+fieldId).value = itemName;
  q('#'+fieldId+'Results').innerHTML = '';
  if(fieldId==='mpSource') window._mergeSourceId = itemId; else window._mergeTargetId = itemId;
}
 
function submitMerge(){
  if(!window._mergeSourceId || !window._mergeTargetId){ showToast('Pick both products from the search results.','err'); return; }
  google.script.run
    .withSuccessHandler(function(res){ if(res.success){ showToast('Products merged.','ok'); closeModal(); loadItems(); loadItemDashboard(); } else showToast(res.message,'err'); })
    .withFailureHandler(function(){ showToast('Failed to merge.','err'); })
    .apiAdminMergeItems(ATOKEN, window._mergeSourceId, window._mergeTargetId);
}
 
</script>
</body>
</html>
