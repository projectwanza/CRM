<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{
      --primary:#101828; --primary-accent:#2952e3; --primary-light:#eef2ff;
      --success:#16a34a; --success-bg:#ecfdf3;
      --danger:#dc2626; --danger-bg:#fef2f2;
      --warning:#d97706; --warning-bg:#fffbeb;
      --neutral-bg:#f6f7fb; --card-bg:#ffffff;
      --text-1:#101828; --text-2:#475467; --text-3:#98a2b3;
      --border:#e4e7ec;
      --radius:14px; --radius-sm:9px;
      --shadow-sm:0 1px 2px rgba(16,24,40,.05);
      --shadow-md:0 4px 12px rgba(16,24,40,.08);
      --shadow-lg:0 12px 32px rgba(16,24,40,.14);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--neutral-bg);color:var(--text-1);}
    button{font-family:inherit;cursor:pointer;}
    input,select{font-family:inherit;}
    .hidden{display:none !important;}

    #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
      background:linear-gradient(135deg,#0b1220 0%,#111827 60%,#1f2937 100%);}
    .login-card{width:100%;max-width:380px;background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);padding:34px 30px;}
    .login-card h1{font-size:20px;margin:0 0 4px;}
    .login-card p.sub{color:var(--text-2);font-size:13px;margin:0 0 22px;}
    .badge-admin{display:inline-block;background:var(--primary);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:14px;letter-spacing:.03em;}
    .field{margin-bottom:14px;}
    .field label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px;}
    .field input{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;}
    .field input:focus{outline:none;border-color:var(--primary-accent);}
    .btn{border:none;border-radius:var(--radius-sm);padding:11px 16px;font-weight:600;font-size:13.5px;}
    .btn-primary{background:var(--primary);color:#fff;width:100%;}
    .btn-primary:hover{background:#000;}
    .btn-secondary{background:var(--primary-light);color:var(--primary-accent);}
    .btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--text-2);}
    .btn-danger{background:var(--danger-bg);color:var(--danger);}
    .login-error{background:var(--danger-bg);color:var(--danger);padding:9px 13px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;}

    #appShell{display:none;min-height:100vh;}
    .topbar{position:sticky;top:0;z-index:20;background:#111827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;}
    .topbar span.title{font-weight:700;font-size:15px;}
    .topbar .badge-admin{margin:0 0 0 8px;background:#2952e3;}
    .topbar-right{display:flex;gap:10px;align-items:center;}
    .topbar-right button{background:rgba(255,255,255,.1);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:12.5px;}

    .tabs{display:flex;gap:4px;padding:14px 20px 0;max-width:1200px;margin:0 auto;overflow-x:auto;}
    .tab-btn{padding:10px 16px;border:none;background:transparent;border-radius:10px 10px 0 0;font-size:13.5px;font-weight:600;color:var(--text-2);white-space:nowrap;}
    .tab-btn.active{background:#fff;color:var(--primary-accent);box-shadow:var(--shadow-sm);}

    .main{max-width:1200px;margin:0 auto;padding:20px;}
    .main.main-wide{max-width:98vw;}
@media(min-width:1600px){.main.main-wide{max-width:1568px;}}
.filters-summary{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;font-size:12.5px;color:var(--text-2);}
.filter-chip{background:#eef2ff;color:#3730a3;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;}
.filter-chip button{border:none;background:none;cursor:pointer;color:inherit;font-weight:700;padding:0;line-height:1;}
.field-group-title{font-size:12px;font-weight:700;color:var(--text-2);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.03em;}
.field-row{display:flex;gap:8px;}
.field-row .field{flex:1;min-width:0;}
.bulk-bar{display:none;align-items:center;justify-content:space-between;gap:10px;background:var(--primary-light);border:1px solid #c7d2fe;border-radius:10px;padding:9px 14px;margin-bottom:12px;font-size:13px;color:#3730a3;}
.bulk-bar.show{display:flex;}
.bulk-bar .btn{padding:7px 14px;font-size:12.5px;}
    .page-header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
    .page-header h2{margin:0 0 4px;font-size:20px;}
    .page-header p{margin:0;color:var(--text-2);font-size:13px;}

    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px;}
    .stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);}
    .stat-card .label{font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;margin-bottom:6px;}
    .stat-card .value{font-size:21px;font-weight:800;}

    .card{background:#fff;border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow-sm);}
    .card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
    .card-header h3{margin:0;font-size:14.5px;}
    .card-body{padding:16px 18px;}

    .filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
    .filters-bar input{padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;flex:1;min-width:180px;}

    table{width:100%;border-collapse:collapse;font-size:13px;}
    thead th{text-align:left;padding:10px 12px;color:var(--text-3);font-weight:700;text-transform:uppercase;font-size:10.5px;border-bottom:1px solid var(--border);white-space:nowrap;}
    tbody td{padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
    .table-scroll{overflow-x:auto;}
    tbody tr:hover{background:var(--neutral-bg);}

    .badge{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;}
    .badge-active{background:var(--success-bg);color:var(--success);}
    .badge-inactive{background:var(--danger-bg);color:var(--danger);}
    .badge-warn{background:var(--warning-bg);color:var(--warning);}
    th.sortable{cursor:pointer;user-select:none;}
    th.sortable .arrow{opacity:.4;margin-left:4px;font-size:9px;}
    th.sortable.sorted .arrow{opacity:1;}
    /* item 4: keep the whole customer table on screen with its own
       scrollbar, instead of the page needing a long scroll */
    .table-scroll.tall{max-height:60vh;overflow-y:auto;}
    .table-scroll.tall thead th{position:sticky;top:0;background:#fff;z-index:1;}

    /* NEW: Purchase Entry table (fpe = Fast Purchase Entry) - fixed,
       compact column widths so nothing overlaps/stretches, with
       horizontal scroll CONTAINED inside .table-scroll (the modal's own
       header/footer never scroll away - see .modal/.modal-body above). */
    #fpeProductTable, #fpeExpenseTable{table-layout:fixed;border-collapse:collapse;}
    #fpeProductTable th, #fpeProductTable td,
    #fpeExpenseTable th, #fpeExpenseTable td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 8px;}
    #fpeProductTable td:first-child, #fpeExpenseTable td:first-child{white-space:normal;overflow:visible;}
    #fpeProductTable input, #fpeExpenseTable input{width:100%;box-sizing:border-box;padding:6px 8px;font-size:12.5px;}

    .row-actions{display:flex;gap:6px;}
    .icon-btn{border:1px solid var(--border);background:#fff;border-radius:7px;padding:6px 10px;font-size:12px;}

    /* --- NEW: Actions dropdown (replaces the old 3-button row) --- */
    .action-select{border:1px solid var(--border);background:#fff;border-radius:7px;padding:6px 8px;font-size:12px;color:var(--text-1);min-width:110px;}

    /* --- NEW: Overview charts grid --- */
    .charts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:4px;}
    .chart-card .card-body{padding:14px 16px 18px;}
    .chart-card canvas{max-height:260px;}

    /* --- NEW: mobile customer cards (hidden on desktop, shown <=760px) --- */
    .customer-cards{display:none;}
    .cust-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
    .cust-card .cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
    .cust-card .cc-name{font-weight:700;font-size:14px;}
    .cust-card .cc-id{font-size:11px;color:var(--text-3);}
    .cust-card .cc-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);padding:4px 0;border-bottom:1px dashed var(--border);}
    .cust-card .cc-row:last-of-type{border-bottom:none;}
    .cust-card .cc-actions{margin-top:10px;}
    .cust-card .cc-actions .action-select{width:100%;}

    .empty-state{text-align:center;padding:40px;color:var(--text-3);font-size:13px;}
    .skeleton{background:linear-gradient(90deg,#eef0f3 25%,#e4e7ec 37%,#eef0f3 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:8px;height:40px;margin-bottom:8px;}
    @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

    .modal-overlay{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
    .modal{background:#fff;width:100%;max-width:440px;border-radius:16px;box-shadow:var(--shadow-lg);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;}
    .modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;}
    .modal-head h3{margin:0;font-size:15px;}
    .modal-close{border:none;background:var(--neutral-bg);width:28px;height:28px;border-radius:50%;}
    .modal-body{padding:18px 20px;flex:1 1 auto;overflow-y:auto;min-height:0;}
    .modal-actions{display:flex;gap:10px;padding:14px 20px;flex:0 0 auto;border-top:1px solid var(--border);}

    /* NEW: Transaction Details modal ko desktop/PC par bada karo,
       taaki Party/Amount + Item Details/Expense/P/L sab ek screen me
       fit ho jaye - 440px wali chhoti box me scroll na karna pade.
       Mobile bilkul unchanged rahega - ye sirf 900px+ screens par,
       aur sirf "modal-txn" class wale modal par lagu hota hai (jo
       sirf Transaction Details modal ko diya gaya hai neeche). */
    @media(min-width:900px){
      .modal.modal-txn{max-width:1100px;width:92vw;max-height:94vh;}
    }

    /* NEW: Purchase Entry modal ko desktop par bada karo, taaki saari
       columns (Item Name..Per Unit) bina horizontal scroll ke, aaram se
       ek screen me dikh jaayein - sirf "modal-pe" class wale modal
       (Purchase Entry) par lagu hota hai, mobile par unaffected. */
    @media(min-width:900px){
      .modal.modal-pe{max-width:1100px;width:92vw;max-height:94vh;}
    }

    #toastHost{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
    .toast{background:#101828;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);}
    .toast.err{background:var(--danger);}
    .toast.ok{background:var(--success);}

    /* --- Customer 360 (added) --- */
    .profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
    .profile-item{background:var(--neutral-bg);border-radius:var(--radius-sm);padding:10px 14px;}
    .profile-item .k{font-size:10.5px;color:var(--text-3);font-weight:700;text-transform:uppercase;margin-bottom:4px;}
    .profile-item .v{font-size:14px;font-weight:600;word-break:break-word;}
    .copy-btn{border:1px solid var(--border);background:#fff;border-radius:6px;padding:2px 8px;font-size:11px;margin-left:6px;color:var(--text-2);}
    .copy-btn.copied{background:var(--success-bg);color:var(--success);border-color:var(--success);}
    .back-link{background:transparent;border:none;color:var(--primary-accent);font-weight:600;font-size:13px;padding:0;margin-bottom:14px;cursor:pointer;}
    .section-gap{margin-top:20px;}

    @media(max-width:760px){
      .stat-grid{grid-template-columns:repeat(2,1fr);}
      .main{padding:14px;}
      .profile-grid{grid-template-columns:1fr 1fr;}
      .charts-grid{grid-template-columns:1fr;}
      /* --- NEW: swap the desktop customer table for phone-friendly cards --- */
      .table-scroll.tall{display:none;}
      .customer-cards{display:block;}
    }
  </style>
</head>
<body>

  <div id="loginScreen">
    <div class="login-card">
      <div class="badge-admin">ADMIN CONSOLE</div>
      <h1>Portal Administration</h1>
      <p class="sub">Manage customer accounts and view system-wide data.</p>
      <div id="loginError" class="login-error hidden"></div>
      <div class="field"><label>Admin Username</label><input type="text" id="adminUser" autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="adminPass" autocomplete="current-password"></div>
      <button class="btn btn-primary" id="adminLoginBtn" onclick="adminLogin()">Sign In</button>
    </div>
  </div>

  <div id="appShell">
    <div class="topbar">
      <div><span class="title">Transaction Portal</span><span class="badge-admin">ADMIN</span></div>
      <div class="topbar-right"><button onclick="adminLogout()">Logout</button></div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="overview" onclick="switchTab('overview')">Overview</button>
      <button class="tab-btn" data-tab="customers" onclick="switchTab('customers')">Customers</button>
      <button class="tab-btn" data-tab="schemes" onclick="switchTab('schemes')">Schemes</button>
      <button class="tab-btn" data-tab="products" onclick="switchTab('products')">Products</button>
      <button class="tab-btn" data-tab="leads" onclick="switchTab('leads')">Leads</button>
      <button class="tab-btn" data-tab="transactions" onclick="switchTab('transactions')">All Transactions</button>
      <button class="tab-btn" data-tab="payout" onclick="switchTab('payout')">Payout</button>
    </div>
    <div class="main" id="mainContent"></div>
  </div>

  <div id="modalHost"></div>
  <div id="toastHost"></div>

<script>
/* NEW: cross-host bridge. If real google.script.run exists (page opened
   from the Apps Script /exec URL), this block does nothing at all.
   If the page is hosted anywhere else (GitHub Pages etc.), it polyfills
   google.script.run so every call below keeps working unchanged. */
(function(){
  var GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwiuWld-fn2nnHtoSiEdrGXn2V0RUm-itIw2OiziY2H1da_uj00ds1eetQJGXgBoDuxVw/exec';

  if (window.google && window.google.script && window.google.script.run) return;
  window.google = window.google || {};
  window.google.script = window.google.script || {};

  function makeRunner(onOk, onErr){
    return new Proxy({}, {
      get: function(_, fnName){
        if (fnName === 'withSuccessHandler') return function(cb){ return makeRunner(cb, onErr); };
        if (fnName === 'withFailureHandler') return function(cb){ return makeRunner(onOk, cb); };
        if (fnName === 'withUserObject')     return function(){ return makeRunner(onOk, onErr); };
        return function(){
          var args = Array.prototype.slice.call(arguments);
          fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify({ fn: fnName, args: args }) })
            .then(function(r){ return r.json(); })
            .then(function(res){
              if (res.ok) { if (onOk) onOk(res.result); }
              else { if (onErr) onErr(new Error(res.error)); else console.error(res.error); }
            })
            .catch(function(err){ if (onErr) onErr(err); else console.error(err); });
        };
      }
    });
  }
  window.google.script.run = makeRunner(null, null);
})();
</script>

<script>
let ATOKEN = sessionStorage.getItem('admin_token') || null;
let CUSTOMER_CACHE = [];

function q(sel){ return document.querySelector(sel); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function money(n){ n=Number(n)||0; return '₹'+n.toLocaleString('en-IN',{maximumFractionDigits:2}); }
function showToast(msg,type){
  const host=q('#toastHost'); const el=document.createElement('div');
  el.className='toast'+(type?' '+type:''); el.textContent=msg; host.appendChild(el);
  setTimeout(function(){el.remove();},3200);
}

function adminLogin(){
  const user = q('#adminUser').value.trim();
  const pass = q('#adminPass').value;
  const errBox = q('#loginError'); errBox.classList.add('hidden');
  if(!user || !pass){ errBox.textContent='Enter username and password.'; errBox.classList.remove('hidden'); return; }
  const btn = q('#adminLoginBtn'); btn.disabled=true; btn.textContent='Signing in...';
  google.script.run
    .withSuccessHandler(function(res){
      btn.disabled=false; btn.textContent='Sign In';
      if(res.success){
        ATOKEN = res.token; sessionStorage.setItem('admin_token', res.token);
        enterAdmin();
      } else { errBox.textContent = res.message || 'Login failed.'; errBox.classList.remove('hidden'); }
    })
    .withFailureHandler(function(){ btn.disabled=false; btn.textContent='Sign In'; errBox.textContent='Login failed.'; errBox.classList.remove('hidden'); })
    .apiAdminLogin(user, pass);
}

function adminLogout(){
  google.script.run.apiAdminLogout(ATOKEN);
  sessionStorage.clear(); ATOKEN = null;
  q('#appShell').style.display='none'; q('#loginScreen').style.display='flex';
}

function enterAdmin(){
  q('#loginScreen').style.display='none';
  q('#appShell').style.display='block';
  switchTab('overview');
}

window.addEventListener('load', function(){
  if(ATOKEN){
    google.script.run.withSuccessHandler(function(res){
      if(res && res.totalCustomers !== undefined){ enterAdmin(); }
    }).withFailureHandler(function(){ sessionStorage.clear(); }).apiAdminOverview(ATOKEN);
  }
  q('#adminPass').addEventListener('keydown', function(e){ if(e.key==='Enter') adminLogin(); });
});

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab')===tab); });
  q('#mainContent').classList.toggle('main-wide', tab==='customers' || tab==='leads' || tab==='transactions' || tab==='payout');
  if(tab==='overview') renderOverview();
  else if(tab==='customers') renderCustomers();
  else if(tab==='schemes') renderSchemesAdmin();
  else if(tab==='products') renderItemsAdmin();
  else if(tab==='leads') renderLeadsAdmin();
  else if(tab==='transactions') renderAllTransactionsAdmin();
  else if(tab==='payout') renderPayoutAdmin();
}

function onAdminSessionError(){
  showToast('Session expired. Please log in again.', 'err');
  adminLogout();
}

/* ================= OVERVIEW ================= */
function renderOverview(){
  const main = q('#mainContent');
  main.innerHTML =
    '<div class="page-header"><div><h2>System Overview</h2><p>Snapshot across all customers.</p></div></div>' +
    '<div class="filters-bar">' +
      '<input type="date" id="ovFrom">' +
      '<input type="date" id="ovTo">' +
      '<button class="btn btn-secondary" onclick="applyOverviewFilter()">Apply</button>' +
      '<button class="btn btn-ghost" onclick="resetOverviewFilter()">All Time</button>' +
    '</div>' +
    '<div class="stat-grid" id="ovStats">' + '<div class="stat-card skeleton" style="height:70px"></div>'.repeat(6) + '</div>' +
    '<div class="charts-grid" id="ovCharts">' +
      chartCard('Sales Trend','ovSalesTrend') +
      chartCard('Payment Received Trend','ovPaymentTrend') +
      chartCard('Outstanding Trend','ovOutstandingTrend') +
      chartCard('Scheme-wise Sales','ovSchemeChart') +
      chartCard('Top Customers by Purchase','ovTopPurchase') +
      chartCard('Top Customers by Outstanding','ovTopOutstanding') +
    '</div>';

  loadOverview();
}

function loadOverview(){
  const from = q('#ovFrom') ? q('#ovFrom').value : '';
  const to = q('#ovTo') ? q('#ovTo').value : '';
  google.script.run
    .withSuccessHandler(function(d){
      q('#ovStats').innerHTML =
        stat('Total Customers', d.totalCustomers) +
        stat('Active Customers', d.activeCustomers) +
        stat('Total Transactions', d.totalTransactions) +
        stat('Total Sales', money(d.totalSales)) +
        stat('Total Payment Received', money(d.totalPaymentReceived)) +
        stat('Total Outstanding', money(d.totalOutstanding));
    })
    .withFailureHandler(function(e){ if(String(e.message).indexOf('ADMIN_SESSION_EXPIRED')>-1) onAdminSessionError(); else showToast('Failed to load overview.','err'); })
    .apiAdminOverview(ATOKEN, from, to);

  // --- NEW: charts ---
  loadOverviewCharts(from, to);
}

function applyOverviewFilter(){ loadOverview(); }
function resetOverviewFilter(){ q('#ovFrom').value=''; q('#ovTo').value=''; loadOverview(); }
function stat(label, value){ return '<div class="stat-card"><div class="label">'+label+'</div><div class="value">'+value+'</div></div>'; }

// --- NEW: chart helpers ---
function chartCard(title, canvasId){
  return '<div class="card chart-card"><div class="card-header"><h3>'+esc(title)+'</h3></div><div class="card-body"><canvas id="'+canvasId+'" height="220"></canvas></div></div>';
}

let OV_CHARTS = {};
function renderChart(canvasId, type, labels, datasets, options){
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  if(OV_CHARTS[canvasId]){ OV_CHARTS[canvasId].destroy(); }
  OV_CHARTS[canvasId] = new Chart(ctx, { type: type, data: { labels: labels, datasets: datasets }, options: Object.assign({ responsive:true, maintainAspectRatio:false }, options||{}) });
}

function loadOverviewCharts(from, to){
  google.script.run
    .withSuccessHandler(function(d){
      renderChart('ovSalesTrend','line',
        d.salesTrend.map(function(x){return x.label;}),

/* ================= SEARCH + ADVANCED FILTERS (+ FINANCIAL/ACTIVITY) ================= */
function defaultCustFilters(){
  return {
    customerId:'', customerName:'', mobile:'', email:'', cliNo:'', status:'',
    dateFrom:'', dateTo:'',
    financial: {
      openingBalance:{op:'',val:'',val2:''}, sales:{op:'',val:'',val2:''},
      payment:{op:'',val:'',val2:''}, outstanding:{op:'',val:'',val2:''}
    },
    saleActivity:'all', paymentActivity:'all'
  };
}
let CUST_FILTERS = defaultCustFilters();

function applyCustFilters(){
  const term = (q('#custSearch') ? q('#custSearch').value : '').toLowerCase();
  const f = CUST_FILTERS;
  let filtered = CUSTOMER_CACHE.filter(function(c){
    if(term &&
      String(c.customerName||'').toLowerCase().indexOf(term)===-1 &&
      String(c.customerId||'').toLowerCase().indexOf(term)===-1 &&
      String(c.mobile||'').toLowerCase().indexOf(term)===-1) return false;
    if(f.customerId && String(c.customerId||'').toLowerCase().indexOf(f.customerId.toLowerCase())===-1) return false;
    if(f.customerName && String(c.customerName||'').toLowerCase().indexOf(f.customerName.toLowerCase())===-1) return false;
    if(f.mobile && String(c.mobile||'').toLowerCase().indexOf(f.mobile.toLowerCase())===-1) return false;
    if(f.email && String(c.email||'').toLowerCase().indexOf(f.email.toLowerCase())===-1) return false;
    if(f.cliNo && String(c.cliNo||'').toLowerCase().indexOf(f.cliNo.toLowerCase())===-1) return false;
    if(f.status && String(c.status||'').toLowerCase() !== f.status.toLowerCase()) return false;
    return true;
  });

  if(CUST_FIN_MODE){
    filtered = filtered.map(function(c){
      const fin = CUST_FIN_CACHE[String(c.customerId).toUpperCase()] || { sales:0, payment:0, openingBalance:c.openingBalance, outstanding:c.outstanding, lastSaleDate:c.lastSaleDate, lastPaymentDate:'' };
      return Object.assign({}, c, {
        sales: fin.sales, payment: fin.payment,
        openingBalance: fin.openingBalance, outstanding: fin.outstanding,
        lastSaleDate: fin.lastSaleDate, lastPaymentDate: fin.lastPaymentDate
      });
    }).filter(function(c){
      if(!passesFinOperator(c.openingBalance, f.financial.openingBalance)) return false;
      if(!passesFinOperator(c.sales, f.financial.sales)) return false;
      if(!passesFinOperator(c.payment, f.financial.payment)) return false;
      if(!passesFinOperator(c.outstanding, f.financial.outstanding)) return false;
      if(f.saleActivity==='done' && !(c.sales>0)) return false;
      if(f.saleActivity==='none' && c.sales>0) return false;
      if(f.paymentActivity==='done' && !(c.payment>0)) return false;
      if(f.paymentActivity==='none' && c.payment>0) return false;
      return true;
    });
  }

  paintCustomers(filtered);
  renderCustFiltersSummary(term, filtered.length);
}

function passesFinOperator(value, cfg){
  if(!cfg || !cfg.op) return true;
  const v = Number(value)||0;
  const a = cfg.val==='' ? null : Number(cfg.val);
  const b = cfg.val2==='' ? null : Number(cfg.val2);
  if(cfg.op==='eq') return a!==null && v===a;
  if(cfg.op==='gt') return a!==null && v>a;
  if(cfg.op==='lt') return a!==null && v<a;
  if(cfg.op==='gte') return a!==null && v>=a;
  if(cfg.op==='lte') return a!==null && v<=a;
  if(cfg.op==='between') return a!==null && b!==null && v>=Math.min(a,b) && v<=Math.max(a,b);
  return true;
}

function hasActiveFinancialFilter(){
  const f = CUST_FILTERS;
  const anyOp = Object.keys(f.financial).some(function(k){ return f.financial[k].op; });
  return !!(f.dateFrom || f.dateTo || anyOp || f.saleActivity!=='all' || f.paymentActivity!=='all');
}

function loadFinancialSummaryIfNeeded(){
  if(!hasActiveFinancialFilter()){
    CUST_FIN_MODE = false; CUST_FIN_CACHE = {};
    refreshCustHead();
    applyCustFilters();

  google.script.run
    .withSuccessHandler(function(list){
      CUST_FIN_CACHE = {};
      list.forEach(function(r){ CUST_FIN_CACHE[String(r.customerId).toUpperCase()] = r; });
      CUST_FIN_MODE = true;
      refreshCustHead();
      applyCustFilters();
    })
    .withFailureHandler(function(e){ if(String(e.message).indexOf('ADMIN_SESSION_EXPIRED')>-1) onAdminSessionError(); else showToast('Failed to load financial summary.','err'); })
    .apiAdminCustomerFinancialSummary(ATOKEN, CUST_FILTERS.dateFrom || '', CUST_FILTERS.dateTo || '');

function finFieldValues(key){
  return { op: q('#af_'+key+'_op').value, val: q('#af_'+key+'_val').value, val2: q('#af_'+key+'_val2').value };
}

function applyCustAdvancedFilters(){
  const month = q('#afMonth').value;
  let dateFrom = q('#afDateFrom').value;
  let dateTo = q('#afDateTo').value;
  if(month){
    const parts = month.split('-'); const y = Number(parts[0]), m = Number(parts[1]);
    dateFrom = y+'-'+String(m).padStart(2,'0')+'-01';
    dateTo = new Date(y, m, 0).toISOString().slice(0,10);
  }
  CUST_FILTERS = {
    customerId: q('#afCustomerId').value.trim(),
    customerName: q('#afCustomerName').value.trim(),
    mobile: q('#afMobile').value.trim(),
    email: q('#afEmail').value.trim(),
    cliNo: q('#afCliNo').value.trim(),
    status: q('#afStatus').value,
    dateFrom: dateFrom, dateTo: dateTo,
    financial: {
      openingBalance: finFieldValues('openingBalance'),
      sales: finFieldValues('sales'),
      payment: finFieldValues('payment'),
      outstanding: finFieldValues('outstanding')
    },
    saleActivity: q('#afSaleActivity').value,
    paymentActivity: q('#afPaymentActivity').value
  };
  closeModal();
  loadFinancialSummaryIfNeeded();
}

function resetCustFilters(){
  CUST_FILTERS = defaultCustFilters();
  CUST_FIN_MODE = false; CUST_FIN_CACHE = {};
  const s = q('#custSearch'); if(s) s.value = '';
  refreshCustHead();
  applyCustFilters();
}

function clearCustFilter(key){
  if(key==='search'){ const s = q('#custSearch'); if(s) s.value=''; applyCustFilters(); return; }
  if(key==='dateRange'){ CUST_FILTERS.dateFrom=''; CUST_FILTERS.dateTo=''; loadFinancialSummaryIfNeeded(); return; }
  if(key==='saleActivity'){ CUST_FILTERS.saleActivity='all'; loadFinancialSummaryIfNeeded(); return; }
  if(key==='paymentActivity'){ CUST_FILTERS.paymentActivity='all'; loadFinancialSummaryIfNeeded(); return; }
  if(CUST_FILTERS.financial[key]){ CUST_FILTERS.financial[key] = {op:'',val:'',val2:''}; loadFinancialSummaryIfNeeded(); return; }
  CUST_FILTERS[key] = '';
  applyCustFilters();
}

function custFilterLabel(k){
  return { customerId:'ID', customerName:'Name', mobile:'Mobile', email:'Email', cliNo:'CLI No', status:'Status',
    openingBalance:'Opening Bal', sales:'Sales', payment:'Payment', outstanding:'Outstanding' }[k] || k;
}

function finOpLabel(c){
  const sym = { eq:'=', gt:'>', lt:'<', gte:'>=', lte:'<=' }[c.op];
  if(c.op==='between') return 'between '+c.val+' and '+c.val2;
  return sym+' '+c.val;
}

function filterChip(label, onclickFn){
  return '<span class="filter-chip">'+esc(label)+'<button onclick="'+onclickFn+'">&times;</button></span>';
}

function renderCustFiltersSummary(term, count){
  const host = q('#custFiltersSummary');
  if(!host) return;
  const f = CUST_FILTERS;
  const chips = [];
  if(term) chips.push(filterChip('Search: "'+term+'"', "clearCustFilter('search')"));
  ['customerId','customerName','mobile','email','cliNo','status'].forEach(function(k){
    if(f[k]) chips.push(filterChip(custFilterLabel(k)+': '+f[k], "clearCustFilter('"+k+"')"));
  });
  if(f.dateFrom || f.dateTo) chips.push(filterChip('Range: '+(f.dateFrom||'\u2026')+' \u2192 '+(f.dateTo||'\u2026'), "clearCustFilter('dateRange')"));
  ['openingBalance','sales','payment','outstanding'].forEach(function(k){
    const c = f.financial[k];
    if(c && c.op) chips.push(filterChip(custFilterLabel(k)+' '+finOpLabel(c), "clearCustFilter('"+k+"')"));
  });
  if(f.saleActivity!=='all') chips.push(filterChip('Sale Activity: '+f.saleActivity, "clearCustFilter('saleActivity')"));
  if(f.paymentActivity!=='all') chips.push(filterChip('Payment Activity: '+f.paymentActivity, "clearCustFilter('paymentActivity')"));
  host.innerHTML = (chips.length ? ('<span>Active Filters:</span>' + chips.join('') + '<button class="btn btn-ghost" style="padding:2px 10px" onclick="resetCustFilters()">Clear All</button>') : '') +
    '<span style="margin-left:auto;font-weight:600;">'+count+' customer'+(count===1?'':'s')+' found</span>';
}

function paintCustomers(list){
  const body = q('#custBody');
  const cardsHost = q('#custCards');
  const colspan = CUST_FIN_MODE ? 15 : 12;
  updateCustBulkBar(); // NEW: keep bulk-bar in sync every time the list is repainted
  if(!list.length){
    body.innerHTML = '<tr><td colspan="'+colspan+'"><div class="empty-state">No customers found.</div></td></tr>';
    if(cardsHost) cardsHost.innerHTML = '<div class="empty-state">No customers found.</div>';
    return;
  }

  const sorted = list.slice().sort(function(a,b){
    let av = a[CUST_SORT.key], bv = b[CUST_SORT.key];
    if(['outstanding','openingBalance','sales','payment'].indexOf(CUST_SORT.key)>-1){ av = Number(av)||0; bv = Number(bv)||0; return (av-bv)*CUST_SORT.dir; }
    av = String(av||'').toLowerCase(); bv = String(bv||'').toLowerCase();
    if(av<bv) return -1*CUST_SORT.dir; if(av>bv) return 1*CUST_SORT.dir; return 0;
  });

  body.innerHTML = sorted.map(function(c){ return '<tr>'+custRowCells(c)+'</tr>'; }).join('');

  // --- mobile card view, same data + actions, shown only <=760px via CSS ---
  if(cardsHost) cardsHost.innerHTML = sorted.map(renderCustCard).join('');
}

function toggleCustomerRowSelect(cb){

  updateCustBulkBar();
  // keep desktop table + mobile cards in sync with each other
  Array.prototype.slice.call(document.querySelectorAll('.custRowCb[value="'+cb.value+'"]')).forEach(function(el){
    el.checked = cb.checked;
  });
}

function toggleAllCustomerSelect(checked){
  Array.prototype.slice.call(document.querySelectorAll('.custRowCb')).forEach(function(cb){
    cb.checked = checked;
    if(checked) SELECTED_CUSTOMER_IDS[cb.value] = true; else delete SELECTED_CUSTOMER_IDS[cb.value];
  });
  updateCustBulkBar();
}

function clearCustomerSelection(){
  SELECTED_CUSTOMER_IDS = {};
  Array.prototype.slice.call(document.querySelectorAll('.custRowCb')).forEach(function(cb){ cb.checked = false; });

function updateCustBulkBar(){
  const bar = q('#custBulkBar');
  if(!bar) return;
  const count = Object.keys(SELECTED_CUSTOMER_IDS).length;
  bar.classList.toggle('show', count > 0);
  const txt = q('#custBulkBarText');
  if(txt) txt.textContent = count + (count===1 ? ' customer selected' : ' customers selected');
}

function paintCustomer360(res){
  const p = res.profile, s = res.summary;
  const statusCls = String(p.status).toLowerCase()==='active' ? 'badge-active' : 'badge-inactive';

  const profileFields = [
    ['Mobile', p.mobile], ['Alternate Phone', p.altPhone], ['Email', p.email],
    ['Owner Name', p.ownerName], ['Ownership', p.ownership], ['Shop Size', p.shopSize],
    ['Shop Services', p.shopServices], ['Area', p.area], ['Address', p.address],
    ['Latitude/Longitude', p.latLong], ['Priority', p.priority], ['Visited Day', p.visitedDay],
    ['Shop Status', p.shopStatus], ['Created Date', p.createdAt], ['Last Login', p.lastLogin],
    ['Remark', p.remark]
  ];
  const profileHtml = profileFields.map(function(f){
    return '<div class="profile-item"><div class="k">'+esc(f[0])+'</div><div class="v">'+esc(f[1]||'-')+'</div></div>';
  }).join('');

  const schemeRegRows = res.schemeRegistrations.length ? res.schemeRegistrations.map(function(r){
    const partyName = (p.customerName + ' (' + p.customerId + '/' + r.schemeId + '/' + r.registrationId + ')').replace(/'/g,"\\'");
    return '<tr><td><b>'+esc(r.schemeName)+'</b><br><span style="font-size:11px;color:var(--text-3);">'+esc(r.schemeId)+'</span></td>' +
      '<td>'+esc(r.registrationId)+'</td><td>'+esc(r.registrationDate)+'</td>' +
      '<td><span class="badge '+(String(r.status).toLowerCase()==='active'?'badge-active':'badge-inactive')+'">'+esc(r.status)+'</span></td>' +
      '<td>'+money(r.totalPurchase)+'</td><td>'+money(r.totalPaid)+'</td><td>'+money(r.totalOutstanding)+'</td><td>'+r.transactions+'</td>' +
      '<td><button class="icon-btn" onclick="copyText(\''+partyName+'\', this)">Copy Party Name</button></td></tr>';
  }).join('') : '<tr><td colspan="9"><div class="empty-state">No scheme registrations yet.</div></td></tr>';

  const recentTxnRows = res.recentTransactions.length ? res.recentTransactions.map(function(t){
    return '<tr><td>'+esc(t.date)+'</td><td>'+esc(t.transactionType)+'</td><td>#'+esc(t.refNo)+'</td><td>'+money(t.amount)+'</td><td>'+money(t.balanceAmount)+'</td><td>'+esc(t.paymentStatus)+'</td></tr>';
  }).join('') : '<tr><td colspan="6"><div class="empty-state">No transactions yet.</div></td></tr>';

  const paymentRows = res.paymentHistory.length ? res.paymentHistory.map(function(t){
    return '<tr><td>'+esc(t.date)+'</td><td>#'+esc(t.refNo)+'</td><td>'+money(t.receivedAmount + t.paidAmount)+'</td></tr>';
  }).join('') : '<tr><td colspan="3"><div class="empty-state">No payments recorded.</div></td></tr>';

  const ledgerRows = res.ledger.length ? res.ledger.map(function(r){
    return '<tr><td>'+esc(r.date)+'</td><td>'+esc(r.transactionType)+'</td><td>#'+esc(r.refNo)+'</td><td>'+esc(r.description||r.transactionType)+'</td>' +
      '<td>'+(r.debit?money(r.debit):'-')+'</td><td>'+(r.credit?money(r.credit):'-')+'</td><td><b>'+money(r.runningBalance)+'</b></td></tr>';
  }).join('') : '<tr><td colspan="7"><div class="empty-state">No ledger entries yet.</div></td></tr>';

  // NEW: Bill-wise Payment Status (FIFO). res.billWiseStatus / res.openingBalanceStatus
  // come from apiAdminGetCustomerProfile - computed server-side by the new
  // FIFO allocation engine (applyFifoBillStatus_ in Code.gs). This is a
  // brand-new card; it does not touch or replace any existing table.
  const billStatusBadgeCls = function(status){
    if (status === 'PAID') return 'badge-active';
    if (status === 'PARTIAL') return 'badge-warn';
    return 'badge-inactive'; // BILL CREATED
  };
  const obs = res.openingBalanceStatus;
  const openingBalanceRow = (obs && obs.amount > 0) ?
    '<tr style="background:var(--neutral-bg);"><td>-</td><td><b>Opening Balance</b></td><td>'+money(obs.amount)+'</td>' +
      '<td>'+money(obs.amount - obs.remaining)+'</td><td>'+money(obs.remaining)+'</td>' +
      '<td><span class="badge '+billStatusBadgeCls(obs.status)+'">'+esc(obs.status)+'</span></td></tr>' : '';
  const billStatusRows = (res.billWiseStatus && res.billWiseStatus.length) ? res.billWiseStatus.map(function(b){
    return '<tr><td>'+esc(b.date)+'</td><td>#'+esc(b.refNo)+'</td><td>'+money(b.billAmount)+'</td>' +
      '<td>'+money(b.paidAmount)+'</td><td>'+money(b.outstanding)+'</td>' +
      '<td><span class="badge '+billStatusBadgeCls(b.status)+'">'+esc(b.status)+'</span></td></tr>';
  }).join('') : '';
  const billStatusBody = (openingBalanceRow + billStatusRows) ||
    '<tr><td colspan="6"><div class="empty-state">No sale bills yet.</div></td></tr>';

  q('#c360Body').innerHTML =
    '<div class="page-header"><div><h2>'+esc(p.customerName)+' <span class="badge '+statusCls+'">'+esc(p.status)+'</span></h2>' +
      '<p>'+esc(p.customerId)+' <button class="copy-btn" onclick="copyText(\''+esc(p.customerId)+'\', this)">Copy ID</button></p></div>' +
      '<button class="btn btn-primary" onclick="openRegisterInScheme(\''+esc(p.customerId)+'\',\''+esc(p.customerName).replace(/'/g,"\\'")+'\')">+ Register in Scheme</button></div>' +
    '<div class="stat-grid" style="grid-template-columns:repeat(6,1fr);">' +
      stat('Total Sales', money(s.totalSales)) + stat('Total Paid', money(s.totalPaid)) + stat('Outstanding', money(s.totalOutstanding)) +
      stat('Transactions', s.totalTransactions) + stat('Schemes', s.totalSchemes) + stat('Last Sale', p.lastSaleDate || '-') +
    '</div>' +
    '<div class="card section-gap"><div class="card-header"><h3>Profile</h3></div><div class="card-body"><div class="profile-grid">'+profileHtml+'</div></div></div>' +
    '<div class="card section-gap"><div class="card-header"><h3>Scheme Registrations</h3></div><div class="table-scroll"><table><thead><tr><th>Scheme</th><th>Reg. ID</th><th>Reg. Date</th><th>Status</th><th>Purchase</th><th>Paid</th><th>Outstanding</th><th>Txns</th><th></th></tr></thead><tbody>'+schemeRegRows+'</tbody></table></div></div>' +
    '<div class="card section-gap"><div class="card-header"><h3>Bill-wise Payment Status (FIFO)</h3></div><div class="table-scroll"><table><thead><tr><th>Date</th><th>Bill / Ref No.</th><th>Amount</th><th>Paid</th><th>Outstanding</th><th>Status</th></tr></thead><tbody>'+billStatusBody+'</tbody></table></div></div>' +
    '<div class="card section-gap"><div class="card-header"><h3>Customer Ledger (All Transactions)</h3></div><div class="table-scroll"><table><thead><tr><th>Date</th><th>Type</th><th>Ref No.</th><th>Description</th><th>Debit</th><th>Credit</th><th>Balance</th></tr></thead><tbody>'+ledgerRows+'</tbody></table></div></div>' +
    '<div class="card section-gap"><div class="card-header"><h3>Recent Transactions</h3></div><div class="table-scroll"><table><thead><tr><th>Date</th><th>Type</th><th>Ref No.</th><th>Amount</th><th>Balance</th><th>Status</th></tr></thead><tbody>'+recentTxnRows+'</tbody></table></div></div>' +
    '<div class="card section-gap"><div class="card-header"><h3>Payment History</h3></div><div class="table-scroll"><table><thead><tr><th>Date</th><th>Ref No.</th><th>Amount</th></tr></thead><tbody>'+paymentRows+'</tbody></table></div></div>' +
    '<div class="card section-gap"><div class="card-header"><h3>Account Linking</h3></div><div class="card-body">' +
      '<div class="profile-grid">' +
        '<div class="profile-item"><div class="k">Customer ID</div><div class="v">'+esc(p.customerId)+'</div></div>' +
        '<div class="profile-item"><div class="k">Customer Name</div><div class="v">'+esc(p.customerName)+'</div></div>' +
        '<div class="profile-item"><div class="k">CLI No</div><div class="v">'+esc(p.cliNo||'Not Linked')+'</div></div>' +
      '</div>' +
      '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">' +
        '<button class="btn btn-secondary" onclick="openLinkCli(\''+esc(p.customerId)+'\')">Link to Existing CLI</button>' +
        (p.cliNo ? '<button class="btn btn-ghost" onclick="unlinkCli(\''+esc(p.customerId)+'\')">Unlink CLI</button>' + '<button class="btn btn-ghost" onclick="viewCliGroup(\''+esc(p.cliNo)+'\')">View Linked Accounts</button>'
                 : '<button class="btn btn-ghost" onclick="createCliForCustomer(\''+esc(p.customerId)+'\')">Create New CLI</button>') +
      '</div>' +
    '</div></div>';
}

/* ---- One-tap copy (section #4) ---- */
function copyText(text, btn){
  const finish = function(){
    if(!btn) return;
    const orig = btn.textContent;
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(function(){ btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(finish).catch(function(){ fallbackCopy_(text); finish(); });
  } else {
    fallbackCopy_(text); finish();
  }
}
function fallbackCopy_(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

// NEW: search-box typing filters the already-loaded list client-side
// ONLY - no server round trip (search doesn't affect totals/P/L scope).
function getAllTxnLocalFiltered_(){
  const term = (q('#allTxnSearch') ? q('#allTxnSearch').value : '').toLowerCase();
  const customerId = q('#allTxnParty') ? q('#allTxnParty').value : '';
  const transactionType = q('#allTxnType') ? q('#allTxnType').value : '';
  const from = q('#allTxnFrom') ? q('#allTxnFrom').value : '';
  const to = q('#allTxnTo') ? q('#allTxnTo').value : '';

  let filtered = ALLTXN_CACHE;
  if(term){
    filtered = filtered.filter(function(t){
      return String(t.partyName||'').toLowerCase().indexOf(term)>-1 ||
        String(t.refNo||'').toLowerCase().indexOf(term)>-1 ||
        String(t.description||'').toLowerCase().indexOf(term)>-1;
    });
  }
  if(customerId){
    filtered = filtered.filter(function(t){ return String(t.customerId||'').toUpperCase() === customerId.toUpperCase(); });
  }
  if(transactionType){
    filtered = filtered.filter(function(t){ return String(t.transactionType||'') === transactionType; });
  }
  if(from || to){
    const fromTime = from ? new Date(from).getTime() : null;
    const toTime = to ? (new Date(to).getTime() + 24*60*60*1000 - 1) : null;
    filtered = filtered.filter(function(t){
      if(!t.dateRaw) return false;
      if(fromTime && t.dateRaw < fromTime) return false;
      if(toTime && t.dateRaw > toTime) return false;
      return true;
    });
  }
  return filtered;
}

  paintAllTransactionsAdmin(getAllTxnLocalFiltered_());

function paintAllTransactionsAdmin(list){
  const body = q('#allTxnBody');
  q('#allTxnPlHead').textContent = PL_MODE==='with' ? 'Net P/L' : (PL_MODE==='without' ? 'Gross P/L' : 'P/L');
  if(!list.length){ body.innerHTML = '<tr><td colspan="14"><div class="empty-state">No transactions found.</div></td></tr>'; return; }
  body.innerHTML = list.map(function(t){
    // Payment-in is never treated as profit - cell stays blank for it.
    const bill = ALLTXN_PL_BY_REF[String(t.refNo).toUpperCase()];
    let plCell = '—';
    if(PL_MODE !== 'hidden' && bill){
      plCell = money(PL_MODE==='with' ? bill.netProfit : bill.grossProfit);
    }
    // NEW: FIFO-computed STATUS cell (t.reportStatus / t.reportStatusEmoji,
    // stamped server-side by applyFifoStatusAllParties_ in Code.gs).
    // stopPropagation so clicking Status opens the small status popup
    // instead of the full Transaction Details modal that the rest of the row opens.
    const statusLabel = t.reportStatus ? (esc((t.reportStatusEmoji||'')+' '+t.reportStatus)) : '—';
    const statusCell = t.reportStatus
      ? '<button class="icon-btn" onclick="event.stopPropagation(); openFifoStatusPopup(\''+esc(t.refNo)+'\',\''+esc(t.transactionType)+'\')">'+statusLabel+'</button>'
      : '—';
    // NEW: Payout micro-badge - Sale rows only (t.payoutPaid/payoutAmount/
    // payoutName/payoutDate stamped server-side in apiAdminListAllTransactions).
    // Purely additive next to the existing statusCell above - does not
    // change the FIFO status button/behaviour in any way.
    const payoutBadge = (t.transactionType === 'Sale')
      ? ' <button class="icon-btn" style="'+(t.payoutPaid ? 'color:var(--success)' : 'color:var(--text-3)')+'" title="'+(t.payoutPaid ? ('Payout: '+esc(t.payoutName||'')+' — '+money(t.payoutAmount)+' on '+esc(t.payoutDate||'')) : 'Payout not given yet')+'" onclick="event.stopPropagation(); openAdminTxnDetail(\''+esc(t.refNo)+'\')">'+(t.payoutPaid ? '✓ Payout' : '✕ Payout')+'</button>'
      : '';
    return '<tr style="cursor:pointer" onclick="openAdminTxnDetail(\''+esc(t.refNo)+'\')">' +
      '<td>'+esc(t.date)+'</td><td>'+esc(t.partyName)+'</td><td>'+esc(t.category)+'</td><td>'+esc(t.transactionType)+'</td>' +
      '<td>#'+esc(t.refNo)+'</td><td>'+esc(t.paymentStatus)+'</td><td>'+esc(t.description)+'</td><td>'+money(t.amount)+'</td>' +
      '<td>'+esc(t.paymentType)+'</td><td>'+money(t.receivedAmount)+'</td><td>'+money(t.paidAmount)+'</td><td>'+money(t.balanceAmount)+'</td>' +
      '<td>'+plCell+'</td>' +
      '<td>'+statusCell+payoutBadge+'</td>' +
    '</tr>';
  }).join('');
}

// NEW: click a row's Status cell -> small popup with the FIFO
// bill-wise breakdown (mirrors the format requested: Bill Amount /
// Paid / Credit Note / Outstanding / Status / adjusted-from list).
// Works for Sale, Payment-in and Credit Note rows - each has its own
// reportStatusDetail shape (see runFifoEngine_ in Code.gs).
function openFifoStatusPopup(refNo, transactionType){
  const t = ALLTXN_CACHE.filter(function(x){ return String(x.refNo)===String(refNo) && x.transactionType===transactionType; })[0];
  if(!t || !t.reportStatusDetail){ showToast('Status detail not available.', 'err'); return; }
  const d = t.reportStatusDetail;
  let rows = '';

  if(t.transactionType === 'Sale'){
    rows =
      row_('Bill Amount', money(d.billAmount)) +
      row_('Paid', money(d.paid)) +
      row_('Credit Note', money(d.creditNoteAmount)) +
      row_('Outstanding', money(d.outstanding)) +
      row_('Status', esc((t.reportStatusEmoji||'')+' '+d.status));
    rows += listBlock_('Payment adjusted from', d.adjustedFrom.map(function(a){
      return esc(a.type)+' #'+esc(a.refNo)+' — '+money(a.amount)+' <span style="color:var(--text-3)">('+esc(a.date)+')</span>';
    }));
  } else if(t.transactionType === 'Payment-in'){
    rows =
      row_('Payment Amount', money(d.paymentAmount)) +
      row_('Allocated', money(d.allocated)) +
      row_('Unallocated / Advance', money(d.unallocated)) +
      row_('Status', esc(d.status));
    rows += listBlock_('Adjusted against', d.allocatedTo.map(function(a){
      return esc(a.target)+(a.refNo ? ' #'+esc(a.refNo) : '')+' — '+money(a.amount);
    }));
  } else if(t.transactionType === 'Credit Note'){
    rows =
      row_('Credit Note Amount', money(d.creditAmount)) +
      row_('Allocated', money(d.allocated)) +
      row_('Unallocated', money(d.unallocated)) +
      row_('Status', esc(d.status));
    rows += listBlock_('Adjusted against', d.allocatedTo.map(function(a){
      return esc(a.target)+(a.refNo ? ' #'+esc(a.refNo) : '')+' — '+money(a.amount);
    }));
  }

  q('#modalHost').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal">' +
      '<div class="modal-head"><h3>Bill #'+esc(refNo)+'</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
      '<div class="modal-body"><div class="profile-grid">'+rows+'</div></div>' +
    '</div></div>';
}

// small helpers used only by openFifoStatusPopup
function row_(label, value){
  return '<div class="profile-item"><div class="k">'+esc(label)+'</div><div class="v">'+value+'</div></div>';
}
function listBlock_(label, items){
  if(!items.length) return '';
  return '<div class="profile-item" style="grid-column:1/-1"><div class="k">'+esc(label)+'</div>' +
    '<div class="v">'+items.map(function(x){ return '<div style="margin-top:4px">'+x+'</div>'; }).join('')+'</div></div>';
}

/* ---- NEW: click a row -> show detail modal (mirrors Index.html) ---- */
/* UPDATED: Item Details section is now 3 tabs - Item Details | Expense | P/L */
let ADMIN_TXN_CURRENT = null;   // current bill's txn row object
let ADMIN_TXN_ITEMS = [];       // Item Details rows for current bill
let ADMIN_TXN_TAB = 'items';    // 'items' | 'delivery' | 'expense' | 'pl'
let ADMIN_TXN_EXPENSE = null;   // apiAdminGetBillExpenseDetail result (cached per open)
let ADMIN_TXN_ITEM_PL = null;   // apiAdminGetBillItemPL result (cached per open)
let ADMIN_TXN_DELIVERY = null;  // apiAdminGetBillDelivery result (cached per open)
let ADMIN_TXN_PAYOUT = null;    // apiAdminGetBillPayoutDetail result (cached per open)

function openAdminTxnDetail(refNo){
  const t = ALLTXN_CACHE.filter(function(x){ return String(x.refNo)===String(refNo); })[0];
  if(!t){ showToast('Transaction not found.', 'err'); return; }

  ADMIN_TXN_CURRENT = t;
  ADMIN_TXN_ITEMS = [];
  ADMIN_TXN_TAB = 'items';
  ADMIN_TXN_EXPENSE = null;
  ADMIN_TXN_ITEM_PL = null;
  ADMIN_TXN_DELIVERY = null;
  ADMIN_TXN_PAYOUT = null;

  q('#modalHost').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal modal-txn">' +
      '<div class="modal-head"><h3>Transaction Details</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
      '<div class="modal-body" id="adminTxnModalBody"><div class="skeleton"></div><div class="skeleton"></div></div>' +
    '</div></div>';

  google.script.run
    .withSuccessHandler(function(items){ ADMIN_TXN_ITEMS = items || []; paintAdminTxnDetail(t); })
    .withFailureHandler(function(e){ if(String(e.message).indexOf('ADMIN_SESSION_EXPIRED')>-1) onAdminSessionError(); else { ADMIN_TXN_ITEMS = []; paintAdminTxnDetail(t); } })
    .apiAdminGetItemsForInvoice(ATOKEN, refNo);
}

// NEW: outer shell (profile info + Amount/Received/Paid/Balance +
// the 3 tabs). Rendered once per bill open - switching tabs never
// re-fetches the item list or re-renders this header.
function paintAdminTxnDetail(t){
  const canShowPl = (t.transactionType === 'Sale' || t.transactionType === 'Credit Note');
  const canShowPayout = (t.transactionType === 'Sale'); // Payout is only ever given against Sale bills
  q('#adminTxnModalBody').innerHTML =
    '<div class="profile-grid">' +
      '<div class="profile-item"><div class="k">Party Name</div><div class="v">'+esc(t.partyName)+'</div></div>' +
      '<div class="profile-item"><div class="k">Ref No.</div><div class="v">#'+esc(t.refNo)+'</div></div>' +
      '<div class="profile-item"><div class="k">Date</div><div class="v">'+esc(t.date)+'</div></div>' +
      '<div class="profile-item"><div class="k">Category</div><div class="v">'+esc(t.category)+'</div></div>' +
      '<div class="profile-item"><div class="k">Transaction Type</div><div class="v">'+esc(t.transactionType)+'</div></div>' +
      '<div class="profile-item"><div class="k">Payment Type</div><div class="v">'+esc(t.paymentType||'-')+'</div></div>' +
    '</div>' +
    '<div class="profile-item section-gap" style="margin-top:12px;"><div class="k">Description</div><div class="v">'+esc(t.description||'-')+'</div></div>' +
    '<div class="stat-grid" style="grid-template-columns:repeat(4,1fr);margin-top:14px;">' +
      stat('Amount', money(t.amount)) + stat('Received', money(t.receivedAmount)) + stat('Paid', money(t.paidAmount)) + stat('Balance', money(t.balanceAmount)) +
    '</div>' +
    '<div class="tabs" style="padding:14px 0 0;margin:0;max-width:none;">' +
      '<button class="tab-btn active" id="adminTxnTabBtn_items" onclick="switchAdminTxnTab(\'items\')">Item Details</button>' +
      (canShowPl ? '<button class="tab-btn" id="adminTxnTabBtn_delivery" onclick="switchAdminTxnTab(\'delivery\')">Delivery</button>' : '') +
      (canShowPl ? '<button class="tab-btn" id="adminTxnTabBtn_expense" onclick="switchAdminTxnTab(\'expense\')">Expense</button>' : '') +
      (canShowPl ? '<button class="tab-btn" id="adminTxnTabBtn_pl" onclick="switchAdminTxnTab(\'pl\')">P/L</button>' : '') +
      (canShowPayout ? '<button class="tab-btn" id="adminTxnTabBtn_payout" onclick="switchAdminTxnTab(\'payout\')">Payout</button>' : '') +
    '</div>' +
    '<div id="adminTxnTabBody" style="margin-top:12px;"></div>' +
    '<div style="margin-top:16px;"><button class="btn btn-ghost" style="width:100%" onclick="closeModal()">Close</button></div>';

  renderAdminTxnTabBody();
}

function switchAdminTxnTab(tab){
  ADMIN_TXN_TAB = tab;
  ['items','delivery','expense','pl','payout'].forEach(function(name){
    const btn = q('#adminTxnTabBtn_'+name);
    if(btn) btn.classList.toggle('active', name===tab);
  });
  renderAdminTxnTabBody();
}

// Renders whichever tab is currently active - fetches Expense/P/L data
// lazily (only on first switch to that tab) and caches it for the rest
// of this modal's lifetime.
function renderAdminTxnTabBody(){
  const el = q('#adminTxnTabBody');
  if(!el) return;

  if(ADMIN_TXN_TAB === 'items'){
    if(!ADMIN_TXN_ITEMS.length){ el.innerHTML = '<div class="empty-state">No items found.</div>'; return; }
    el.innerHTML = '<div class="table-scroll"><table><thead><tr><th>Item</th><th>Code</th><th>HSN</th><th>Qty</th><th>Unit</th><th>Rate</th><th>Disc.</th><th>GST</th><th>Amount</th></tr></thead><tbody>' +
      ADMIN_TXN_ITEMS.map(function(it){
        return '<tr><td>'+esc(it.itemName)+'</td><td>'+esc(it.itemCode)+'</td><td>'+esc(it.hsnSac)+'</td>' +
          '<td>'+esc(it.quantity)+'</td><td>'+esc(it.unit)+'</td><td>'+money(it.pricePerUnit)+'</td>' +
          '<td>'+esc(it.discount)+'</td><td>'+esc(it.gst)+'</td><td>'+money(it.amount)+'</td></tr>';
      }).join('') + '</tbody></table></div>';
    return;
  }

  if(ADMIN_TXN_TAB === 'delivery'){
    if(ADMIN_TXN_DELIVERY){ paintAdminTxnDeliveryTab(); return; }
    el.innerHTML = '<div class="skeleton"></div>';
    google.script.run
      .withSuccessHandler(function(res){ ADMIN_TXN_DELIVERY = res; if(ADMIN_TXN_TAB==='delivery') paintAdminTxnDeliveryTab(); })
      .withFailureHandler(function(){ ADMIN_TXN_DELIVERY = { success:false }; if(ADMIN_TXN_TAB==='delivery') paintAdminTxnDeliveryTab(); })
      .apiAdminGetBillDelivery(ATOKEN, ADMIN_TXN_CURRENT.refNo);
    return;
  }

  if(ADMIN_TXN_TAB === 'payout'){
    if(ADMIN_TXN_PAYOUT){ paintAdminTxnPayoutTab(); return; }
    el.innerHTML = '<div class="skeleton"></div>';
    google.script.run
      .withSuccessHandler(function(res){ ADMIN_TXN_PAYOUT = res; if(ADMIN_TXN_TAB==='payout') paintAdminTxnPayoutTab(); })
      .withFailureHandler(function(){ ADMIN_TXN_PAYOUT = { success:false }; if(ADMIN_TXN_TAB==='payout') paintAdminTxnPayoutTab(); })
      .apiAdminGetBillPayoutDetail(ATOKEN, ADMIN_TXN_CURRENT.refNo);
    return;
  }

  if(PL_MODE === 'hidden'){
    el.innerHTML = '<div class="empty-state">Click \uD83D\uDC41 P/L (top-right) to view Expense / P/L for this bill.</div>';
    return;
  }

  if(ADMIN_TXN_TAB === 'expense'){
    if(ADMIN_TXN_EXPENSE){ paintAdminTxnExpenseTab(); return; }
    el.innerHTML = '<div class="skeleton"></div>';
    google.script.run
      .withSuccessHandler(function(res){ ADMIN_TXN_EXPENSE = res; if(ADMIN_TXN_TAB==='expense') paintAdminTxnExpenseTab(); })
      .withFailureHandler(function(){ ADMIN_TXN_EXPENSE = { success:false }; if(ADMIN_TXN_TAB==='expense') paintAdminTxnExpenseTab(); })
      .apiAdminGetBillExpenseDetail(ATOKEN, ADMIN_TXN_CURRENT.refNo);
    return;
  }

  if(ADMIN_TXN_TAB === 'pl'){
    if(ADMIN_TXN_ITEM_PL){ paintAdminTxnPlTab(); return; }
    el.innerHTML = '<div class="skeleton"></div>';
    google.script.run
      .withSuccessHandler(function(res){ ADMIN_TXN_ITEM_PL = res; if(ADMIN_TXN_TAB==='pl') paintAdminTxnPlTab(); })
      .withFailureHandler(function(){ ADMIN_TXN_ITEM_PL = { success:false }; if(ADMIN_TXN_TAB==='pl') paintAdminTxnPlTab(); })
      .apiAdminGetBillItemPL(ATOKEN, ADMIN_TXN_CURRENT.refNo);
    return;
  }
}

function paintAdminTxnExpenseTab(){
  const el = q('#adminTxnTabBody');
  if(!el || ADMIN_TXN_TAB !== 'expense') return;
  const res = ADMIN_TXN_EXPENSE;
  if(!res || !res.success){ el.innerHTML = '<div class="empty-state">Failed to load expenses.</div>'; return; }
  if(!res.lines.length){ el.innerHTML = '<div class="empty-state">No expenses applied to this bill.</div>'; return; }
  el.innerHTML = '<div class="table-scroll"><table><thead><tr><th>Expense</th><th>Type</th><th>Rate</th><th>Amount</th><th>Applied By</th></tr></thead><tbody>' +
    res.lines.map(function(l){
      const rate = l.type === 'Percentage' ? (l.rateValue + '%') : money(l.rateValue);
      return '<tr><td>'+esc(l.name)+'</td><td>'+esc(l.type)+'</td><td>'+rate+'</td><td>'+money(l.amount)+'</td><td>'+esc(l.appliedBy||'\u2014')+'</td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<div class="stat-grid" style="grid-template-columns:repeat(1,1fr);margin-top:14px;">' + stat('Total Expense', money(res.total)) + '</div>';
}

function paintAdminTxnPlTab(){
  const el = q('#adminTxnTabBody');
  if(!el || ADMIN_TXN_TAB !== 'pl') return;
  const res = ADMIN_TXN_ITEM_PL;
  if(!res || !res.success){ el.innerHTML = '<div class="empty-state">Failed to load P/L.</div>'; return; }
  const rows = PL_MODE === 'with'
    ? res.items.map(function(it){
        return '<tr><td>'+esc(it.itemName)+'</td><td>'+esc(it.qty)+'</td><td>'+money(it.saleRate)+'</td><td>'+money(it.saleAmount)+'</td>' +
          '<td>'+plPurchaseRateCell(it)+'</td><td>'+money(it.cost)+'</td><td>'+money(it.grossPL)+'</td><td>'+money(it.expense)+'</td><td>'+money(it.netPL)+'</td>' +
          '<td>'+plProductCell(it)+'</td><td>'+plRemarkCell(it)+'</td></tr>';
      }).join('')
    : res.items.map(function(it){
        return '<tr><td>'+esc(it.itemName)+'</td><td>'+esc(it.qty)+'</td><td>'+money(it.saleRate)+'</td><td>'+money(it.saleAmount)+'</td>' +
          '<td>'+plPurchaseRateCell(it)+'</td><td>'+money(it.cost)+'</td><td>'+money(it.grossPL)+'</td>' +
          '<td>'+plProductCell(it)+'</td><td>'+plRemarkCell(it)+'</td></tr>';
      }).join('');
  const head = PL_MODE === 'with'
    ? '<th>Item</th><th>Qty</th><th>Sale Rate</th><th>Sale Amount</th><th>Purchase Rate</th><th>Cost</th><th>Gross P/L</th><th>Expense</th><th>Net P/L</th><th>Product</th><th>Remark</th>'
    : '<th>Item</th><th>Qty</th><th>Sale Rate</th><th>Sale Amount</th><th>Purchase Rate</th><th>Cost</th><th>Gross P/L</th><th>Product</th><th>Remark</th>';
  el.innerHTML = '<div class="table-scroll"><table><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div>' +
    (PL_MODE === 'with'
      ? ('<div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin-top:14px;">' +
          stat('Gross P/L', money(res.totals.grossProfit)) + stat('Total Expense', money(res.totals.expenseAdjustment)) + stat('Net P/L', money(res.totals.netProfit)) +
        '</div>')
      : ('<div class="stat-grid" style="grid-template-columns:repeat(1,1fr);margin-top:14px;">' + stat('Gross P/L', money(res.totals.grossProfit)) + '</div>'));
}

function plPurchaseRateCell(it){
  const isManual = it.purchaseRateSource === 'manual';
  const badge = '<span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:5px;background:'+(isManual?'#fef3c7':'var(--neutral-bg)')+';color:'+(isManual?'#92400e':'var(--text-3)')+'">'+(isManual?'MANUAL':'AUTO')+'</span>';
  return '<div style="display:flex;align-items:center;gap:4px;white-space:nowrap">'+money(it.purchaseRate)+badge+
    '<button class="btn btn-ghost" style="font-size:10px;padding:2px 6px" onclick="openEditPurchaseRateModal(\''+esc(it.itemNameUpper)+'\')">Edit</button></div>';
}

function plProductCell(it){
  if(it.linkedItemId) return '<span style="font-size:11px;color:var(--text-2)">Linked</span>';
  return '<button class="btn btn-ghost" style="font-size:11px;padding:4px 8px;color:var(--danger)" onclick="openLinkPlProductModal(\''+esc(it.itemName).replace(/'/g,"\\'")+'\')">Link Product</button>';
}

function plRemarkCell(it){
  return '<div style="display:flex;align-items:center;gap:4px;max-width:160px;">' +
    '<span style="font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">'+esc(it.remark||'\u2014')+'</span>' +
    '<button class="btn btn-ghost" style="font-size:10px;padding:2px 6px" onclick="openEditPlRemarkModal(\''+esc(it.itemName).replace(/'/g,"\\'")+'\',\''+esc(it.remark||'').replace(/'/g,"\\'")+'\')">Edit</button></div>';
}

function openEditPurchaseRateModal(itemNameUpper){

  q('#modalHost').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal">' +
      '<div class="modal-head"><h3>Edit Purchase Rate</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
      '<div class="modal-body">' +

function submitPurchaseRateOverride(itemName){
  const val = q('#prOverrideInput').value;
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.success){ showToast(res.message || 'Failed to save.', 'err'); return; }
      showToast('Purchase Rate updated.', 'ok');
      closeModal(); ADMIN_TXN_ITEM_PL = null; switchAdminTxnTab('pl');
    })
    .withFailureHandler(function(){ showToast('Failed to save.', 'err'); })
    .apiAdminSetItemPurchaseRateOverride(ATOKEN, ADMIN_TXN_CURRENT.refNo, itemName, val);
}

function resetPurchaseRateOverride(itemName){
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.success){ showToast(res.message || 'Failed to reset.', 'err'); return; }
      showToast('Reset to Auto Purchase Rate.', 'ok');
      closeModal(); ADMIN_TXN_ITEM_PL = null; switchAdminTxnTab('pl');
    })
    .withFailureHandler(function(){ showToast('Failed to reset.', 'err'); })
    .apiAdminSetItemPurchaseRateOverride(ATOKEN, ADMIN_TXN_CURRENT.refNo, itemName, '');
}

    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal">' +
      '<div class="modal-head"><h3>Edit Remark</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
      '<div class="modal-body">' +
        '<div class="field"><label>Item</label><input type="text" value="'+esc(itemName)+'" disabled></div>' +
        '<div class="field"><label>Remark</label><textarea id="plRemarkInput" rows="3" style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px">'+esc(currentRemark)+'</textarea></div>' +
      '</div>' +
      '<div class="modal-actions"><button class="btn btn-primary" style="flex:1" onclick="submitPlRemark(\''+esc(itemName).replace(/'/g,"\\'")+'\')">Save</button><button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancel</button></div>' +
    '</div></div>';
}

function submitPlRemark(itemName){
  const remark = q('#plRemarkInput').value;
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.success){ showToast(res.message || 'Failed to save remark.', 'err'); return; }
      showToast('Remark saved.', 'ok');

function paintAdminTxnPayoutTab(){
  const el = q('#adminTxnTabBody');
  if(!el || ADMIN_TXN_TAB !== 'payout') return;
  const res = ADMIN_TXN_PAYOUT;
  if(!res || !res.success){ el.innerHTML = '<div class="empty-state">Failed to load payout details.</div>'; return; }

  const ok = '<span style="color:var(--success);font-weight:700">✓</span>';
  const cross = '<span style="color:var(--text-3);font-weight:700">✕</span>';
  const paymentTick = res.paymentStatus === 'Full' ? ok : (res.paymentStatus === 'Partial' ? '<span style="color:#b45309;font-weight:700">◐</span>' : cross);
  const deliveryTick = res.deliveryStatus === 'Fully Delivered' ? ok : (res.deliveryStatus === 'Partially Delivered' ? '<span style="color:#b45309;font-weight:700">◐</span>' : cross);
  const payoutTick = res.payoutStatus === 'Paid' ? ok : cross;

  const checklist =
    '<div class="card" style="padding:14px;margin-bottom:16px;">' +
      '<h4 style="margin:0 0 10px;font-size:13px;">Bill Status</h4>' +
      '<div style="display:flex;flex-direction:column;gap:6px;font-size:13px;">' +
        '<div>'+ok+' Bill Created</div>' +
        '<div>'+paymentTick+' Payment: '+esc(res.paymentStatus)+'</div>' +
        '<div>'+deliveryTick+' Delivery: '+esc(res.deliveryStatus)+'</div>' +
        '<div>'+payoutTick+' Payout: '+esc(res.payoutStatus)+'</div>' +
      '</div>' +
    '</div>';

  if(!res.payouts.length){
    el.innerHTML = checklist + '<div class="empty-state">No payout given against this bill yet. Use "+ Payout" on the report screen to give one.</div>';
    return;
  }

  const rows = res.payouts.map(function(p){
    const basedOn = p.calcType === 'PERCENTAGE' ? (p.calcBase === 'PL' ? 'Total P/L' : 'Total Sale') : '—';
    const typeLabel = p.calcType === 'PERCENTAGE' ? (p.value + '%') : money(p.value);
    return '<div class="profile-grid" style="margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:14px;">' +
      '<div class="profile-item"><div class="k">Payout Name</div><div class="v">'+esc(p.payoutName)+'</div></div>' +
      '<div class="profile-item"><div class="k">Payout Type</div><div class="v">'+esc(typeLabel)+'</div></div>' +
      '<div class="profile-item"><div class="k">Based On</div><div class="v">'+esc(basedOn)+'</div></div>' +
      '<div class="profile-item"><div class="k">Bill P/L</div><div class="v">'+money(p.billPL)+'</div></div>' +
      '<div class="profile-item"><div class="k">Payout</div><div class="v" style="color:var(--success);font-weight:700">'+money(p.payoutAmount)+'</div></div>' +
      '<div class="profile-item"><div class="k">Payout Date</div><div class="v">'+esc(p.payoutDate)+'</div></div>' +
    '</div>';
  }).join('');

  el.innerHTML = checklist +
    '<h4 style="margin:0 0 8px;font-size:13px;">Payout Details'+(res.payouts.length>1 ? ' (Total: '+money(res.totalPayout)+')' : '')+'</h4>' +
    rows;
}

function submitDelivery(){
  const date = q('#dlvDate').value;
  if(!date){ showToast('Pick a delivery date.', 'err'); return; }
  const note = q('#dlvNote').value.trim();
  const lines = []; let invalid = null;
  Array.prototype.slice.call(document.querySelectorAll('.dlvQtyInput')).forEach(function(inp){
    const qty = Number(inp.value) || 0;
    const pending = Number(inp.dataset.pending) || 0;
    if(qty > 0){
      if(qty > pending) invalid = 'Only '+pending+' quantity is pending for "'+inp.dataset.item+'".';
      lines.push({ itemName: inp.dataset.item, qty: qty });
    }
  });
  if(invalid){ showToast(invalid, 'err'); return; }
  if(!lines.length){ showToast('Enter at least one Delivery Qty.', 'err'); return; }

  google.script.run
    .withSuccessHandler(function(res){
      if(!res.success){ showToast(res.message || 'Failed to save delivery.', 'err'); return; }
      showToast('Delivery saved.', 'ok');
      closeModal();
      ADMIN_TXN_DELIVERY = null;
      switchAdminTxnTab('delivery');
    })
    .withFailureHandler(function(){ showToast('Failed to save delivery.', 'err'); })
    .apiAdminSaveDelivery(ATOKEN, ADMIN_TXN_CURRENT.refNo, date, lines, note);
}

            '<input type="text" id="ruleBillNo" placeholder="Bill/Invoice No." oninput="loadRuleBillsForSelection()">' +
            '<input type="text" id="ruleBillProduct" placeholder="Product" oninput="loadRuleBillsForSelection()">' +
            '<input type="text" id="ruleBillPayStatus" placeholder="Payment Status" oninput="loadRuleBillsForSelection()">' +
          '</div>' +
          '<div style="margin-bottom:8px;"><label style="font-size:12px;"><input type="checkbox" id="ruleBillSelectAll" onchange="toggleAllRuleBills(this.checked)"> Select All</label></div>' +

        '</div>' +

        '<div class="table-scroll" id="ruleListBox"><div class="skeleton"></div></div>' +

    '</div></div>';

  ensureCustomerCacheThen_(paintRuleCustomerList);

function onRuleCalcTypeChange(){
  const isPct = q('#ruleCalcType').value === 'PERCENTAGE';
  q('#ruleValueLabel').textContent = isPct ? 'Percentage (%)' : 'Amount (₹)';
}

function paintRuleCustomerList(){
  const host = q('#ruleCustList');
  if(!host) return;
  const term = (q('#ruleCustSearch') ? q('#ruleCustSearch').value : '').toLowerCase();
  const allChecked = q('#ruleCustAll') ? q('#ruleCustAll').checked : false;
  const list = (CUSTOMER_CACHE||[]).filter(function(c){
    return !term || String(c.customerName||'').toLowerCase().indexOf(term)>-1 || String(c.customerId||'').toLowerCase().indexOf(term)>-1;
  });
  host.innerHTML = list.map(function(c){
    return '<label style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;">' +
      '<input type="checkbox" class="ruleCustCb" value="'+esc(c.customerId)+'" '+(allChecked?'disabled':'')+'> '+esc(c.customerName)+' ('+esc(c.customerId)+')</label>';
  }).join('') || '<p style="color:var(--text-3);font-size:12px;">No customers found.</p>';
}

function getSelectedRuleCustomerIds_(){
  return Array.prototype.slice.call(document.querySelectorAll('.ruleCustCb:checked')).map(function(cb){ return cb.value; });
}

function submitExpenseRule(){
  const ruleName = q('#ruleName').value.trim();
  if(!ruleName){ showToast('Enter Expense Name / Employee.', 'err'); return; }
  const categorySel = q('#ruleCategory').value;
  const category = (categorySel === '__new__') ? q('#ruleCategoryNew').value.trim() : categorySel;
  const calcType = q('#ruleCalcType').value;
  const value = q('#ruleValue').value;
  if(!value){ showToast('Enter Amount/Percentage.', 'err'); return; }
  const startDate = q('#ruleStartDate').value;
  if(!startDate){ showToast('Select Start Date.', 'err'); return; }
  const allCustomers = q('#ruleCustAll').checked;
  const customerIds = allCustomers ? [] : getSelectedRuleCustomerIds_();
  if(!allCustomers && !customerIds.length){ showToast('Select at least one customer, or check All Customers.', 'err'); return; }

  const data = {
    ruleName: ruleName,
    category: category,
    calcType: calcType,
    value: value,
    customerScope: allCustomers ? 'ALL' : 'SELECTED',
    customerIds: customerIds,
    startDate: startDate,
    endDate: q('#ruleEndDate').value,
    status: q('#ruleStatus').value
  };

  google.script.run
    .withSuccessHandler(function(res){
      if(!res.success){ showToast(res.message || 'Failed to save rule.', 'err'); return; }
      showToast('Expense Rule saved.', 'ok');
      CURRENT_RULE_ID_FOR_APPLY = res.ruleId;
      q('#ruleBillsSection').classList.remove('hidden');
      q('#ruleBillFrom').value = startDate;
      loadRuleBillsForSelection();
      loadExpenseRulesList();
    })
    .withFailureHandler(function(){ showToast('Failed to save rule.', 'err'); })
    .apiAdminCreateExpenseRule(ATOKEN, data);
}

function loadRuleBillsForSelection(){
  if(!CURRENT_RULE_ID_FOR_APPLY) return;
  const allCustomers = q('#ruleCustAll').checked;
  const filters = {
    dateFrom: q('#ruleBillFrom').value,
    dateTo: q('#ruleBillTo').value,
    customerIds: allCustomers ? [] : getSelectedRuleCustomerIds_(),
    billNo: q('#ruleBillNo').value,
    product: q('#ruleBillProduct').value,
    paymentStatus: q('#ruleBillPayStatus').value
  };
  q('#ruleBillsList').innerHTML = '<div class="skeleton"></div>';
  google.script.run
    .withSuccessHandler(function(list){ RULE_BILLS_CACHE = list; paintRuleBillsList(); })
    .withFailureHandler(function(){ q('#ruleBillsList').innerHTML = '<div class="empty-state">Failed to load bills.</div>'; })
    .apiAdminGetBillsForExpenseRule(ATOKEN, filters);
}

function paintRuleBillsList(){
  const host = q('#ruleBillsList');
  if(!host) return;
  if(!RULE_BILLS_CACHE.length){ host.innerHTML = '<div class="empty-state">No matching sale bills.</div>'; return; }
  host.innerHTML = '<table><thead><tr><th></th><th>Date</th><th>Customer</th><th>Bill No</th><th>Sale Amount</th><th>Existing Expense</th></tr></thead><tbody>' +
    RULE_BILLS_CACHE.map(function(b){
      return '<tr><td><input type="checkbox" class="ruleBillCb" value="'+esc(b.refNo)+'" checked></td>' +
        '<td>'+esc(b.date)+'</td><td>'+esc(b.customerName)+'</td><td>#'+esc(b.refNo)+'</td>' +
        '<td>'+money(b.saleAmount)+'</td><td>'+money(b.existingExpense)+'</td></tr>';
    }).join('') + '</tbody></table>';
}

function toggleAllRuleBills(checked){
  Array.prototype.slice.call(document.querySelectorAll('.ruleBillCb')).forEach(function(cb){ cb.checked = checked; });
}

function applyRuleToSelectedBills(){
  if(!CURRENT_RULE_ID_FOR_APPLY){ showToast('Save the rule first.', 'err'); return; }
  const refNos = Array.prototype.slice.call(document.querySelectorAll('.ruleBillCb:checked')).map(function(cb){ return cb.value; });
  if(!refNos.length){ showToast('Select at least one bill.', 'err'); return; }
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.success){ showToast(res.message || 'Failed to apply.', 'err'); return; }
      showToast(res.applied.length + ' bill(s) updated' + (res.skipped.length ? (', ' + res.skipped.length + ' skipped (already applied)') : '') + '.', 'ok');
      loadRuleBillsForSelection();
      applyAllTxnFilters();
    })
    .withFailureHandler(function(){ showToast('Failed to apply expense.', 'err'); })
    .apiAdminApplyExpenseRuleToBills(ATOKEN, CURRENT_RULE_ID_FOR_APPLY, refNos);
}

function loadExpenseRulesList(){
  google.script.run
    .withSuccessHandler(function(list){
      EXPENSE_RULE_CACHE = list;
      paintRuleCategoryDropdown('__new__');
      const box = q('#ruleListBox');
      if(!box) return;
      if(!list.length){ box.innerHTML = '<div class="empty-state">No expense rules yet.</div>'; return; }
      box.innerHTML = '<table><thead><tr><th>Name</th><th>Category</th><th>Type</th><th>Value</th><th>Customers</th><th>Start</th><th>End</th><th>Status</th><th></th></tr></thead><tbody>' +
        list.slice().reverse().map(function(r){
          const custLabel = (!r.customerScope || String(r.customerScope).toUpperCase()==='ALL') ? 'All' : (String(r.customerScope).split(',').length + ' selected');
          const isActive = String(r.status).toLowerCase() === 'active';
          return '<tr><td>'+esc(r.ruleName)+'</td><td>'+esc(r.category)+'</td><td>'+esc(r.calcType)+'</td>' +
            '<td>'+(r.calcType==='PERCENTAGE' ? (r.value+'%') : money(r.value))+'</td>' +
            '<td>'+esc(custLabel)+'</td><td>'+esc(r.startDate)+'</td><td>'+esc(r.endDate||'-')+'</td>' +
            '<td><span class="badge">'+esc(r.status)+'</span></td>' +
            '<td style="white-space:nowrap"><a href="#" onclick="toggleExpenseRuleStatus(\''+esc(r.ruleId)+'\',\''+(isActive?'Inactive':'Active')+'\');return false;">'+(isActive?'Deactivate':'Activate')+'</a> &nbsp;' +
            '<a href="#" onclick="deleteExpenseRule(\''+esc(r.ruleId)+'\');return false;">Delete</a></td></tr>';
        }).join('') + '</tbody></table>';
    })
    .withFailureHandler(function(){})
    .apiAdminListExpenseRules(ATOKEN);
}

function paintRuleCategoryDropdown(selectedValue){
  const sel = q('#ruleCategory');
  if(!sel) return;
  const seen = {};
  const categories = [];
  EXPENSE_RULE_CACHE.forEach(function(r){
    const c = String(r.category || '').trim();
    if(c && !seen[c.toUpperCase()]){ seen[c.toUpperCase()] = true; categories.push(c); }
  });
  sel.innerHTML = '<option value="__new__">+ Add New Category</option>' +
    categories.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join('');
  sel.value = (selectedValue && seen[String(selectedValue).toUpperCase()]) ? selectedValue : '__new__';
  q('#ruleCategoryNewWrap').classList.toggle('hidden', sel.value !== '__new__');
}

function toggleExpenseRuleStatus(ruleId, newStatus){
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.success){ showToast(res.message || 'Failed to update.', 'err'); return; }
      showToast('Rule ' + newStatus.toLowerCase() + 'd.', 'ok');
      loadExpenseRulesList();
      applyAllTxnFilters();
    })
    .withFailureHandler(function(){ showToast('Failed to update rule.', 'err'); })
    .apiAdminSetExpenseRuleStatus(ATOKEN, ruleId, newStatus);
}

function deleteExpenseRule(ruleId){
  if(!confirm('Delete this Expense Rule? Historical applied expenses on past bills will NOT be removed.')) return;
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.success){ showToast(res.message || 'Failed to delete.', 'err'); return; }
      showToast('Rule deleted.', 'ok');
      loadExpenseRulesList();
      applyAllTxnFilters();
    })
    .withFailureHandler(function(){ showToast('Failed to delete rule.', 'err'); })
    .apiAdminDeleteExpenseRule(ATOKEN, ruleId);
}

let PAYOUT_CACHE = [];
let PAYOUT_BILLS_CACHE = [];
let CURRENT_PAYOUT_ID = null;
let CURRENT_PAYOUT_META = null; // { payoutId, payoutName, calcType, value, calcBase } - for the confirm dialog

function openPayoutModal(){

  CURRENT_PAYOUT_META = null;
  q('#modalHost').innerHTML =

          '<div class="filters-bar" style="margin-bottom:10px;">' +

          '</div>' +

          '<div class="table-scroll" style="max-height:280px" id="payoutBillsList"><div class="skeleton"></div></div>' +
