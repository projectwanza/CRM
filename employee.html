<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --primary:#101828; --primary-accent:#2952e3; --primary-light:#eef2ff;
      --success:#16a34a; --success-bg:#ecfdf3;
      --danger:#dc2626; --danger-bg:#fef2f2;
      --warning:#d97706; --warning-bg:#fffbeb;
      --neutral-bg:#f6f7fb; --card-bg:#ffffff;
      --text-1:#101828; --text-2:#475467; --text-3:#98a2b3;
      --border:#e4e7ec;
      --radius:14px; --radius-sm:9px;
      --shadow-sm:0 1px 2px rgba(16,24,40,.05);
      --shadow-md:0 4px 12px rgba(16,24,40,.08);
      --shadow-lg:0 12px 32px rgba(16,24,40,.14);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--neutral-bg);color:var(--text-1);}
    button{font-family:inherit;cursor:pointer;}
    input,select,textarea{font-family:inherit;}
    .hidden{display:none !important;}

    #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
      background:linear-gradient(135deg,#0b1220 0%,#111827 60%,#1f2937 100%);}
    .login-card{width:100%;max-width:380px;background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);padding:34px 30px;}
    .login-card h1{font-size:20px;margin:0 0 4px;}
    .login-card p.sub{color:var(--text-2);font-size:13px;margin:0 0 22px;}
    .badge-emp{display:inline-block;background:#2952e3;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:14px;letter-spacing:.03em;}
    .field{margin-bottom:14px;}
    .field label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px;}
    .field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;}
    .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary-accent);}
    .btn{border:none;border-radius:var(--radius-sm);padding:11px 16px;font-weight:600;font-size:13.5px;}
    .btn-primary{background:var(--primary);color:#fff;width:100%;}
    .btn-primary:hover{background:#000;}
    .btn-secondary{background:var(--primary-light);color:var(--primary-accent);}
    .btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--text-2);}
    .btn-danger{background:var(--danger-bg);color:var(--danger);}
    .btn-success{background:var(--success-bg);color:var(--success);}
    .btn:disabled{opacity:.6;cursor:not-allowed;}
    .login-error{background:var(--danger-bg);color:var(--danger);padding:9px 13px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;}

    #appShell{display:none;min-height:100vh;}
    .topbar{position:sticky;top:0;z-index:20;background:#111827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;}
    .topbar span.title{font-weight:700;font-size:15px;}
    .topbar .badge-emp{margin:0 0 0 8px;}
    .topbar-right{display:flex;gap:10px;align-items:center;}
    .topbar-right button{background:rgba(255,255,255,.1);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:12.5px;}

    .tabs{display:flex;gap:4px;padding:14px 20px 0;max-width:900px;margin:0 auto;overflow-x:auto;}
    .tab-btn{padding:10px 16px;border:none;background:transparent;border-radius:10px 10px 0 0;font-size:13.5px;font-weight:600;color:var(--text-2);white-space:nowrap;}
    .tab-btn.active{background:#fff;color:var(--primary-accent);box-shadow:var(--shadow-sm);}

    .main{max-width:900px;margin:0 auto;padding:20px;}
    .page-header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
    .page-header h2{margin:0 0 4px;font-size:20px;}
    .page-header p{margin:0;color:var(--text-2);font-size:13px;}

    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px;}
    .stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);}
    .stat-card .label{font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;margin-bottom:6px;}
    .stat-card .value{font-size:21px;font-weight:800;}

    .card{background:#fff;border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow-sm);}
    .card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
    .card-header h3{margin:0;font-size:14.5px;}
    .card-body{padding:16px 18px;}

    .attendance-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:var(--shadow-sm);text-align:center;}
    .attendance-card .att-status{font-size:13px;color:var(--text-2);margin-bottom:14px;}
    .attendance-card .att-timer{font-size:28px;font-weight:800;margin-bottom:14px;font-variant-numeric:tabular-nums;}
    .attendance-card .btn{padding:13px 24px;font-size:14px;min-width:160px;}

    .filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
    .filters-bar input{padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;flex:1;min-width:180px;}

    table{width:100%;border-collapse:collapse;font-size:13px;}
    thead th{text-align:left;padding:10px 12px;color:var(--text-3);font-weight:700;text-transform:uppercase;font-size:10.5px;border-bottom:1px solid var(--border);white-space:nowrap;}
    tbody td{padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
    .table-scroll{overflow-x:auto;}
    tbody tr:hover{background:var(--neutral-bg);}
    tbody tr.clickable{cursor:pointer;}

    .icon-btn{border:1px solid var(--border);background:#fff;border-radius:7px;padding:6px 10px;font-size:13px;}
    .icon-btn.add-visit{color:var(--primary-accent);font-weight:800;}

    .badge{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;}
    .badge-active{background:var(--success-bg);color:var(--success);}
    .badge-inactive{background:var(--danger-bg);color:var(--danger);}

    .empty-state{text-align:center;padding:40px;color:var(--text-3);font-size:13px;}
    .skeleton{background:linear-gradient(90deg,#eef0f3 25%,#e4e7ec 37%,#eef0f3 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:8px;height:40px;margin-bottom:8px;}
    @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

    .modal-overlay{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
    .modal{background:#fff;width:100%;max-width:460px;border-radius:16px;box-shadow:var(--shadow-lg);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;}
    .modal.modal-wide{max-width:720px;}
    .modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;}
    .modal-head h3{margin:0;font-size:15px;}
    .modal-close{border:none;background:var(--neutral-bg);width:28px;height:28px;border-radius:50%;}
    .modal-body{padding:18px 20px;flex:1 1 auto;overflow-y:auto;min-height:0;}
    .modal-actions{display:flex;gap:10px;padding:14px 20px;flex:0 0 auto;border-top:1px solid var(--border);}

    .profile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px;}
    .profile-item{background:var(--neutral-bg);border-radius:var(--radius-sm);padding:10px 14px;}
    .profile-item .k{font-size:10.5px;color:var(--text-3);font-weight:700;text-transform:uppercase;margin-bottom:4px;}
    .profile-item .v{font-size:14px;font-weight:600;word-break:break-word;}
    .back-link{background:transparent;border:none;color:var(--primary-accent);font-weight:600;font-size:13px;padding:0;margin-bottom:14px;cursor:pointer;}
    .section-gap{margin-top:20px;}
    .duplicate-warning{background:var(--warning-bg);color:var(--warning);padding:10px 13px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;}

    #toastHost{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
    .toast{background:#101828;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);}
    .toast.err{background:var(--danger);}
    .toast.ok{background:var(--success);}

    @media(max-width:760px){
      .stat-grid{grid-template-columns:repeat(2,1fr);}
      .main{padding:14px;}
      .profile-grid{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>

  <div id="loginScreen">
    <div class="login-card">
      <div class="badge-emp">EMPLOYEE PORTAL</div>
      <h1>Employee Sign In</h1>
      <p class="sub">Log in with the ID your admin gave you.</p>
      <div id="loginError" class="login-error hidden"></div>
      <div class="field"><label>Employee ID / Username</label><input type="text" id="empUser" autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="empPass" autocomplete="current-password"></div>
      <button class="btn btn-primary" id="empLoginBtn" onclick="employeeLogin()">Sign In</button>
    </div>
  </div>

  <div id="appShell">
    <div class="topbar">
      <div><span class="title">Transaction Portal</span><span class="badge-emp" id="topEmpName">EMPLOYEE</span></div>
      <div class="topbar-right"><button onclick="employeeLogout()">Logout</button></div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="dashboard" onclick="switchEmpTab('dashboard')">Dashboard</button>
      <button class="tab-btn" data-tab="customers" onclick="switchEmpTab('customers')">My Customers</button>
      <button class="tab-btn" data-tab="orders" onclick="switchEmpTab('orders')">Orders</button>
      <button class="tab-btn" data-tab="attendance" onclick="switchEmpTab('attendance')">Attendance</button>
    </div>
    <div class="main" id="mainContent"></div>
  </div>

  <div id="modalHost"></div>
  <div id="toastHost"></div>

<script>
/* Cross-host bridge - identical pattern to Admin.html. If the page is
   opened directly from the Apps Script /exec URL, google.script.run
   already exists and this block does nothing. If hosted elsewhere
   (e.g. GitHub Pages), it polyfills google.script.run over fetch. */
(function(){
  var GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwqY1Xy4A8UB_IhV3hxszbZuOoJT985aERQiDLoh9V-c-qnp-81Wz1gULjsMpp9txuKkA/exec';

  if (window.google && window.google.script && window.google.script.run) return;
  window.google = window.google || {};
  window.google.script = window.google.script || {};

  function makeRunner(onOk, onErr){
    return new Proxy({}, {
      get: function(_, fnName){
        if (fnName === 'withSuccessHandler') return function(cb){ return makeRunner(cb, onErr); };
        if (fnName === 'withFailureHandler') return function(cb){ return makeRunner(onOk, cb); };
        if (fnName === 'withUserObject')     return function(){ return makeRunner(onOk, onErr); };
        return function(){
          var args = Array.prototype.slice.call(arguments);
          fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify({ fn: fnName, args: args }) })
            .then(function(r){ return r.json(); })
            .then(function(res){
              if (res.ok) { if (onOk) onOk(res.result); }
              else { if (onErr) onErr(new Error(res.error)); else console.error(res.error); }
            })
            .catch(function(err){ if (onErr) onErr(err); else console.error(err); });
        };
      }
    });
  }
  window.google.script.run = makeRunner(null, null);
})();
</script>

<script>
let ETOKEN = sessionStorage.getItem('employee_token') || null;
let EMP_NAME = sessionStorage.getItem('employee_name') || '';
let MY_CUSTOMERS_CACHE = [];
let ATTENDANCE_TIMER_ = null;

function q(sel){ return document.querySelector(sel); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function money(n){ n=Number(n)||0; return '₹'+n.toLocaleString('en-IN',{maximumFractionDigits:2}); }
function stat(label,value){ return '<div class="stat-card"><div class="label">'+esc(label)+'</div><div class="value">'+value+'</div></div>'; }
// NEW: same stat-card look, just clickable (used by "Today's Visits").
function clickableStat_(label,value,onclick){ return '<div class="stat-card" style="cursor:pointer" onclick="'+onclick+'"><div class="label">'+esc(label)+' \u203a</div><div class="value">'+value+'</div></div>'; }
function closeModal(){ q('#modalHost').innerHTML=''; }
function showToast(msg,type){
  const host=q('#toastHost'); const el=document.createElement('div');
  el.className='toast'+(type?' '+type:''); el.textContent=msg; host.appendChild(el);
  setTimeout(function(){el.remove();},3200);
}

/* ================= LOGIN / SESSION ================= */

function employeeLogin(){
  const user = q('#empUser').value.trim();
  const pass = q('#empPass').value;
  const errBox = q('#loginError'); errBox.classList.add('hidden');
  if(!user || !pass){ errBox.textContent='Enter your Employee ID and password.'; errBox.classList.remove('hidden'); return; }
  const btn = q('#empLoginBtn'); btn.disabled=true; btn.textContent='Signing in...';
  google.script.run
    .withSuccessHandler(function(res){
      btn.disabled=false; btn.textContent='Sign In';
      if(res && res.success){
        ETOKEN = res.token; EMP_NAME = res.employeeName;
        sessionStorage.setItem('employee_token', res.token);
        sessionStorage.setItem('employee_name', res.employeeName);
        enterEmployee();
      } else { errBox.textContent = (res && res.message) || 'Login failed.'; errBox.classList.remove('hidden'); }
    })
    .withFailureHandler(function(){ btn.disabled=false; btn.textContent='Sign In'; errBox.textContent='Login failed.'; errBox.classList.remove('hidden'); })
    .apiEmployeeLogin(user, pass);
}

function employeeLogout(){
  google.script.run.apiEmployeeLogout(ETOKEN);
  sessionStorage.clear(); ETOKEN = null; EMP_NAME = '';
  if(ATTENDANCE_TIMER_){ clearInterval(ATTENDANCE_TIMER_); ATTENDANCE_TIMER_ = null; }
  q('#appShell').style.display='none'; q('#loginScreen').style.display='flex';
}

function enterEmployee(){
  q('#loginScreen').style.display='none';
  q('#appShell').style.display='block';
  q('#topEmpName').textContent = EMP_NAME || 'EMPLOYEE';
  switchEmpTab('dashboard');
}

function onEmployeeSessionError(err){
  const msg = (err && err.message) ? err.message : String(err || 'Unknown error');
  console.error('Employee API error:', msg); // open DevTools (F12) Console to read this
  if (msg.indexOf('EMPLOYEE_SESSION_EXPIRED') !== -1) {
    showToast('Session expired. Please log in again.', 'err');
    employeeLogout();
  } else {
    showToast('Error: ' + msg, 'err'); // real reason, no forced logout
  }
}

window.addEventListener('load', function(){
  if(ETOKEN){
    google.script.run.withSuccessHandler(function(res){
      if(res && res.valid){ EMP_NAME = res.employeeName; sessionStorage.setItem('employee_name', EMP_NAME); enterEmployee(); }
      else { sessionStorage.clear(); }
    }).withFailureHandler(function(){ sessionStorage.clear(); }).apiEmployeeCheckSession(ETOKEN);
  }
  q('#empPass').addEventListener('keydown', function(e){ if(e.key==='Enter') employeeLogin(); });
});

function switchEmpTab(tab){
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab')===tab); });
  if(tab==='dashboard') renderEmpDashboard();
  else if(tab==='customers') renderMyCustomers();
  else if(tab==='orders') renderOrdersPage();
  else if(tab==='attendance') renderAttendancePage();
}

/* ================= GEOLOCATION HELPER ================= */

// Wraps navigator.geolocation in a promise; resolves to {lat:'',lng:''}
// (blank strings, not failure) if location is unavailable/denied, so a
// missing GPS fix never blocks Check In/Out or a Visit from being saved.
function captureLocation_(){
  return new Promise(function(resolve){
    if(!navigator.geolocation){ resolve({lat:'',lng:''}); return; }
    navigator.geolocation.getCurrentPosition(
      function(pos){ resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
      function(){ resolve({lat:'',lng:''}); },
      { enableHighAccuracy:true, timeout:8000, maximumAge:0 }
    );
  });
}

/* ================= DASHBOARD ================= */

function renderEmpDashboard(){
  const main = q('#mainContent');
  main.innerHTML =
    '<div class="page-header"><div><h2>Dashboard</h2><p>Your daily snapshot.</p></div></div>' +
    '<div class="stat-grid" id="empStats">' + '<div class="stat-card skeleton" style="height:70px"></div>'.repeat(4) + '</div>';
  google.script.run
    .withSuccessHandler(function(res){
      if(!res || !res.success){ q('#empStats').innerHTML = '<div class="empty-state">Failed to load dashboard.</div>'; return; }
      q('#empStats').innerHTML =
        stat('My Customers', res.myCustomers) +
        clickableStat_("Today's Visits", res.todaysVisits, 'openTodaysVisitsModal()') +
        stat('Monthly Sales', money(res.monthlySales)) +
        stat('Outstanding Due', money(res.outstandingDue));
    })
    .withFailureHandler(onEmployeeSessionError)
    .apiEmployeeGetDashboard(ETOKEN);
}

/* ================= MY CUSTOMERS ================= */

let MC_DAY_FILTER = ''; // NEW - Visited Day filter chip currently active

function renderMyCustomers(){
  const main = q('#mainContent');
  main.innerHTML =
    '<div class="page-header"><div><h2>My Customers</h2><p>Customers assigned to you by Admin.</p></div>' +
      '<button class="btn btn-secondary" onclick="openAddCustomerModal()">+ Add Customer</button>' +
    '</div>' +
    '<div class="filters-bar"><input type="text" id="mcSearch" placeholder="Search customer..." oninput="paintMyCustomers_()"></div>' +
    '<div id="mcDayFilters" style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;"></div>' +
    '<div class="table-scroll" id="mcList"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';
  MC_DAY_FILTER = '';
  google.script.run
    .withSuccessHandler(function(list){
      MY_CUSTOMERS_CACHE = list || [];
      paintMcDayFilters_();
      paintMyCustomers_();
    })
    .withFailureHandler(onEmployeeSessionError)
    .apiEmployeeGetMyCustomers(ETOKEN);
}

// NEW: clickable Mon-Sun chips - click a day to show only customers
// whose Visited Day includes that day; click again (or "Clear") to reset.
function paintMcDayFilters_(){
  const host = q('#mcDayFilters');
  if(!host) return;
  host.innerHTML = WEEKDAYS_.map(function(d){
    const active = MC_DAY_FILTER===d;
    return '<button class="btn '+(active?'btn-primary':'btn-ghost')+'" style="padding:5px 12px;font-size:12px;" onclick="toggleMcDayFilter_(\''+d+'\')">'+d.substring(0,3)+'</button>';
  }).join('') + (MC_DAY_FILTER ? '<button class="btn btn-ghost" style="padding:5px 12px;font-size:12px;" onclick="toggleMcDayFilter_(\'\')">Clear</button>' : '');
}
function toggleMcDayFilter_(day){
  MC_DAY_FILTER = (MC_DAY_FILTER===day) ? '' : day;
  paintMcDayFilters_();
  paintMyCustomers_();
}

function paintMyCustomers_(){
  const host = q('#mcList');
  if(!host) return;
  const term = (q('#mcSearch')?q('#mcSearch').value:'').toLowerCase();
  const list = MY_CUSTOMERS_CACHE.filter(function(c){
    if(term && String(c.customerName||'').toLowerCase().indexOf(term)===-1 && String(c.mobile||'').indexOf(term)===-1) return false;
    // NEW: Visited Day chip filter
    if(MC_DAY_FILTER){
      const days = String(c.visitedDay||'').split(',').map(function(s){ return s.trim(); });
      if(days.indexOf(MC_DAY_FILTER)===-1) return false;
    }
    return true;
  });
  if(!list.length){ host.innerHTML = '<div class="empty-state">No customers found.</div>'; return; }
  // Action column moved right after Customer. Location icon only shows
  // when a saved Lat,Long OR Address exists - otherwise a "📍+ Add
  // Location" icon opens the same edit form used in the profile.
  host.innerHTML = '<table><thead><tr><th>Customer</th><th style="width:104px">Action</th><th>Outstanding</th><th>Last Sale</th><th>Last Visit</th><th>Visited Day</th></tr></thead><tbody>' +
    list.map(function(c){
      const cid = esc(c.customerId);
      const hasLocation = !!(String(c.latLong||'').trim() || String(c.address||'').trim());
      const locationBtn = hasLocation
        ? '<button class="icon-btn" title="Location" onclick="event.stopPropagation();openCustomerLocation_(\''+esc(c.latLong||'')+'\',\''+esc(c.address||'')+'\')">📍</button>'
        : '<button class="icon-btn" title="Add Location" onclick="event.stopPropagation();openCustomerContactModal_(\''+cid+'\',\''+esc(c.customerName)+'\',\''+esc(c.mobile||'')+'\',\''+esc(c.address||'')+'\',\''+esc(c.latLong||'')+'\')">📍+</button>';
      return '<tr class="clickable"><td onclick="openCustomerProfile(\''+cid+'\')">'+esc(c.customerName)+'</td>' +
        '<td style="white-space:nowrap;">' +
          '<button class="icon-btn" title="Call" onclick="event.stopPropagation();callCustomer_(\''+esc(c.mobile||'')+'\')">📞</button> ' +
          locationBtn + ' ' +
          '<button class="icon-btn add-visit" title="Add Visit" onclick="event.stopPropagation();openAddVisitModal(\''+cid+'\',\''+esc(c.customerName)+'\')">+</button> ' +
          '<button class="icon-btn" title="Create Order" onclick="event.stopPropagation();openCreateOrderModal_(\''+cid+'\',\''+esc(c.customerName)+'\')">📦+</button>' +
        '</td>' +
        '<td onclick="openCustomerProfile(\''+cid+'\')" style="font-weight:700;color:'+(c.outstanding>0?'#c0392b':'#101828')+'">'+money(c.outstanding)+'</td>' +
        '<td onclick="openCustomerProfile(\''+cid+'\')">'+esc(c.lastSaleDate||'—')+'</td>' +
        '<td onclick="openCustomerProfile(\''+cid+'\')">'+esc(c.lastVisitDate||'—')+'</td>' +
        '<td style="cursor:pointer" title="Click to set" onclick="event.stopPropagation();openVisitedDayModal(\''+cid+'\',\''+esc(c.customerName)+'\',\''+esc(c.visitedDay||'')+'\')">'+esc(c.visitedDay||'Set day')+'</td>' +
        '</tr>';
    }).join('') + '</tbody></table>';
}

/* ---- Customer profile (basic info + full transaction history) ---- */

function openCustomerProfile(customerId){
  const main = q('#mainContent');

// NEW: live duplicate-phone check as the employee types the mobile
// number - shows which existing customer already has that number and
// who it's assigned to, BEFORE they hit Save.
let AC_DUP_TIMER_ = null;
function checkAcDuplicate_(){
  clearTimeout(AC_DUP_TIMER_);
  const mobile = q('#acMobile').value.trim();
  const box = q('#acDuplicate');
  if(!mobile){ box.className='hidden'; box.innerHTML=''; return; }
  AC_DUP_TIMER_ = setTimeout(function(){
    google.script.run
      .withSuccessHandler(function(res){
        if(res && res.exists){
          box.className='duplicate-warning';
          box.innerHTML = 'Already in CRM as <strong>'+esc(res.customerName)+'</strong> ('+esc(res.customerId)+'), assigned to <strong>'+esc(res.assignedTo||'Unassigned')+'</strong>.';
        } else { box.className='hidden'; box.innerHTML=''; }
      })
      .withFailureHandler(function(){})
      .apiEmployeeCheckPhoneExists(ETOKEN, mobile);
  }, 400);
}

function saveNewCustomer(){
  const name = q('#acName').value.trim();
  const mobile = q('#acMobile').value.trim();
  const email = q('#acEmail').value.trim();
  const opening = Number(q('#acOpening').value) || 0;
  if(!name){ showToast('Customer name is required.', 'err'); return; }
  if(!mobile){ showToast('Mobile number is required.', 'err'); return; }
  const btn = q('#acSaveBtn'); btn.disabled=true; btn.textContent='Saving...';
  google.script.run
    .withSuccessHandler(function(res){
      btn.disabled=false; btn.textContent='Save';
      if(res && res.success){
        showToast('Customer added: '+res.customerId, 'ok');
        closeModal();
        renderMyCustomers();
      } else { showToast((res && res.message) || 'Failed to add customer.', 'err'); }
    })
    .withFailureHandler(function(){ btn.disabled=false; btn.textContent='Save'; showToast('Failed to add customer.', 'err'); })
    .apiEmployeeCreateCustomer(ETOKEN, { customerName: name, mobile: mobile, email: email, openingBalance: opening });
}

// NEW: 📞 Call icon - direct dial to the customer's REGISTERED mobile
// number (mobile itself is no longer shown in the table, only used here).
function callCustomer_(mobile){
  const m = String(mobile||'').trim();
  if(!m){ showToast('Mobile number not available for this customer.', 'err'); return; }
  window.location.href = 'tel:'+m;
}

// NEW: 📍 Location icon - opens Google Maps DIRECTIONS to the customer.
// No API key / paid integration needed - plain Google Maps URL scheme.
// Prefers the saved Lat,Long (exact pin); falls back to the saved
// Address text if no Lat,Long is on file; shows a message if neither exists.
function openCustomerLocation_(latLong, address){
  const s = String(latLong||'').trim();
  if(s){
    const parts = s.split(',');
    if(parts.length===2 && !isNaN(parseFloat(parts[0])) && !isNaN(parseFloat(parts[1]))){
      window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(parts[0].trim()+','+parts[1].trim()), '_blank');
      return;
    }
  }
  const a = String(address||'').trim();
  if(a){
    window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a), '_blank');
    return;
  }
  showToast('Address not available for this customer.', 'err');
}

// NEW: matches the exact requested layout - 🟢 Present / Check-in /
// Check-out / Working Hours - and enforces the flow: not checked in ->
// Check In button; checked in only -> Check Out button; both done ->
// summary only (buttons enforcing "1 check-in, 1 check-out" already
// happen server-side in apiEmployeeCheckIn/CheckOut).
function paintAttendanceCardV2_(res){
  const card = q('#attCard');
  if(!card) return;
  if(!res){ card.innerHTML = '<div class="empty-state">Failed to load attendance.</div>'; return; }
  if(!res.checkedIn){
    card.innerHTML =
      '<p style="text-align:center;color:var(--text-2);margin:0 0 14px;">You have not checked in today.</p>' +
      '<p style="text-align:center;font-size:22px;font-weight:700;margin:0 0 18px;letter-spacing:2px;">--:--:--</p>' +
      '<button class="btn btn-primary" id="attActionBtn" style="width:100%" onclick="empCheckInV2_()">Check In</button>';
    return;
  }
  if(res.checkedIn && !res.checkedOut){
    card.innerHTML =
      '<p style="text-align:center;margin:0 0 6px;"><span style="color:#16a34a;font-weight:700;">🟢 Present</span></p>' +
      '<p style="text-align:center;color:var(--text-2);margin:0 0 18px;font-size:13px;">Check-in: '+esc(fmtAmPm_(res.checkInTime))+'</p>' +
      '<button class="btn btn-primary" id="attActionBtn" style="width:100%" onclick="empCheckOutV2_()">Check Out</button>';
    return;
  }
  card.innerHTML =
    '<p style="text-align:center;margin:0 0 10px;"><span style="color:#16a34a;font-weight:700;">🟢 Present</span></p>' +
    '<p style="text-align:center;color:var(--text-2);margin:0 0 4px;font-size:13px;">Check-in: '+esc(fmtAmPm_(res.checkInTime))+'</p>' +
    '<p style="text-align:center;color:var(--text-2);margin:0 0 4px;font-size:13px;">Check-out: '+esc(fmtAmPm_(res.checkOutTime))+'</p>' +
    '<p style="text-align:center;color:var(--text-1);margin:8px 0 0;font-size:13.5px;font-weight:600;">Working Hours: '+esc(res.workingHours||'—')+'</p>';
}

function fmtAmPm_(t){ // 'HH:mm:ss' -> '9:42 AM'
  if(!t) return '—';
  const p = t.split(':').map(Number);
  let h = p[0]%12; if(h===0) h=12;
  const ampm = p[0]<12 ? 'AM' : 'PM';
  return h+':'+(p[1]<10?'0'+p[1]:p[1])+' '+ampm;
}

/* ---- Attendance History (calendar) ---- */
let ATT_HISTORY_MONTH = '';
function openAttendanceHistoryModal(){
  const now = new Date();
  ATT_HISTORY_MONTH = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  q('#modalHost').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal" style="max-width:480px">' +
      '<div class="modal-head"><h3>📅 Attendance History</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
      '<div class="modal-body">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">' +
          '<button class="btn btn-ghost" onclick="shiftAttHistoryMonth_(-1)">&larr;</button>' +
          '<strong id="attHistMonthLabel"></strong>' +
          '<button class="btn btn-ghost" onclick="shiftAttHistoryMonth_(1)">&rarr;</button>' +
        '</div>' +
        '<div style="display:flex;gap:14px;justify-content:center;margin-bottom:10px;font-size:12px;">' +
          '<span>🟢 Present</span><span>🔴 Absent</span><span>⚪ Upcoming</span>' +
        '</div>' +
        '<div id="attHistGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;"></div>' +
        '<p style="font-size:11px;color:var(--text-3);margin-top:12px;text-align:center;">Leave tracking isn\'t set up yet - only Present/Absent are shown.</p>' +
      '</div>' +
    '</div></div>';
  loadAttendanceHistory_();
}
function shiftAttHistoryMonth_(delta){
  const parts = ATT_HISTORY_MONTH.split('-').map(Number);
  const d = new Date(parts[0], parts[1]-1+delta, 1);
  ATT_HISTORY_MONTH = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  loadAttendanceHistory_();
}
function loadAttendanceHistory_(){
  q('#attHistGrid').innerHTML = '<div class="skeleton"></div>';
  google.script.run
    .withSuccessHandler(function(res){
      if(!res || !res.success){ q('#attHistGrid').innerHTML = '<div class="empty-state">Failed to load.</div>'; return; }
      paintAttendanceHistory_(res);
    })
    .withFailureHandler(function(){ q('#attHistGrid').innerHTML = '<div class="empty-state">Failed to load.</div>'; })
    .apiEmployeeGetAttendanceHistory(ETOKEN, ATT_HISTORY_MONTH);
}
function paintAttendanceHistory_(res){
  const parts = res.monthKey.split('-').map(Number);
  q('#attHistMonthLabel').textContent = new Date(parts[0], parts[1]-1, 1).toLocaleString('default',{month:'long', year:'numeric'});
  const firstDow = new Date(parts[0], parts[1]-1, 1).getDay();
  let html = ['S','M','T','W','T','F','S'].map(function(d){ return '<div style="text-align:center;font-size:10px;color:var(--text-3);font-weight:700;">'+d+'</div>'; }).join('');
  for(let i=0;i<firstDow;i++) html += '<div></div>';
  res.days.forEach(function(d){
    const color = d.status==='Present' ? '#16a34a' : (d.status==='Absent' ? '#dc2626' : '#98a2b3');
    const bg = d.status==='Present' ? '#ecfdf3' : (d.status==='Absent' ? '#fef2f2' : '#f6f7fb');
    html += '<div title="'+esc(d.status)+(d.checkInTime?(' - In: '+esc(d.checkInTime)):'')+'" style="text-align:center;padding:6px 0;border-radius:8px;background:'+bg+';color:'+color+';font-size:12px;font-weight:600;">'+d.day+'</div>';
  });
  q('#attHistGrid').innerHTML = html;
}

function paintAttendanceCard_(res){
  const card = q('#attCard');
  if(!card) return;
  if(ATTENDANCE_TIMER_){ clearInterval(ATTENDANCE_TIMER_); ATTENDANCE_TIMER_ = null; }

  if(!res || !res.checkedIn){
    card.innerHTML =
      '<div class="att-status">You have not checked in today.</div>' +
      '<div class="att-timer">--:--:--</div>' +
      '<button class="btn btn-primary" id="attBtn" onclick="doCheckIn_()">Check In</button>';
    return;
  }
  if(res.checkedOut){
    card.innerHTML =
      '<div class="att-status">Checked in at '+esc(res.checkInTime)+', checked out at '+esc(res.checkOutTime)+'.</div>' +
      '<div class="att-timer">Done for today ✅</div>' +
      '<button class="btn btn-ghost" disabled>Attendance Complete</button>';
    return;
  }
  // checked in, not yet checked out - show a live-running timer
  card.innerHTML =
    '<div class="att-status">Checked in at '+esc(res.checkInTime)+'.</div>' +
    '<div class="att-timer" id="attTimerText">00:00:00</div>' +
    '<button class="btn btn-danger" id="attBtn" onclick="doCheckOut_()">Check Out</button>';
  const parts = String(res.checkInTime||'0:0:0').split(':').map(Number);
  const checkInMs = new Date();
  checkInMs.setHours(parts[0]||0, parts[1]||0, parts[2]||0, 0);
  ATTENDANCE_TIMER_ = setInterval(function(){
    const diff = Math.max(0, Date.now() - checkInMs.getTime());
    const h = String(Math.floor(diff/3600000)).padStart(2,'0');
    const m = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
    const s = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
    const el = q('#attTimerText'); if(el) el.textContent = h+':'+m+':'+s;
  }, 1000);
}

function doCheckIn_(){
  const btn = q('#attBtn'); btn.disabled=true; btn.textContent='Capturing location...';
  captureLocation_().then(function(loc){
    google.script.run
      .withSuccessHandler(function(res){
        if(res && res.success){ showToast('Checked in.', 'ok'); paintAttendanceCardV2_({ checkedIn:true, checkedOut:false, checkInTime: res.checkInTime }); }
        else { showToast((res && res.message) || 'Check in failed.', 'err'); btn.disabled=false; btn.textContent='Check In'; }
      })
      .withFailureHandler(function(){ showToast('Check in failed.', 'err'); btn.disabled=false; btn.textContent='Check In'; })
      .apiEmployeeCheckIn(ETOKEN, loc.lat, loc.lng);
  });
}

function doCheckOut_(){
  const btn = q('#attBtn'); btn.disabled=true; btn.textContent='Capturing location...';
  captureLocation_().then(function(loc){
    google.script.run
      .withSuccessHandler(function(res){
        if(res && res.success){ showToast('Checked out.', 'ok'); loadAttendanceStatus_(); }
        else { showToast((res && res.message) || 'Check out failed.', 'err'); btn.disabled=false; btn.textContent='Check Out'; }
      })
      .withFailureHandler(function(){ showToast('Check out failed.', 'err'); btn.disabled=false; btn.textContent='Check Out'; })
      .apiEmployeeCheckOut(ETOKEN, loc.lat, loc.lng);
  });
}
/* ================= ORDERS (NEW) ================= */

let MY_ORDERS_CACHE = [];
let ORDER_ITEM_ROWS_ = [];

function renderOrdersPage(){
  const main = q('#mainContent');
  main.innerHTML =
    '<div class="page-header"><div><h2>Orders</h2><p>Orders you have created.</p></div></div>' +
    '<div class="table-scroll" id="ordersList"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';
  loadMyOrders_();
}

function loadMyOrders_(){
  google.script.run
    .withSuccessHandler(function(res){
      MY_ORDERS_CACHE = (res && res.success) ? res.orders : [];
      paintMyOrdersTable_();
    })
    .withFailureHandler(onEmployeeSessionError)
    .apiEmployeeGetMyOrders(ETOKEN);
}

function paintMyOrdersTable_(){
  const host = q('#ordersList');
  if(!host) return;
  if(!MY_ORDERS_CACHE.length){ host.innerHTML = '<div class="empty-state">No orders yet. Use the 📦+ icon in My Customers to create one.</div>'; return; }
  host.innerHTML = '<table><thead><tr><th>Order No.</th><th>Customer</th><th>Order Date</th><th>Total Items</th><th>Total Qty</th><th>Status</th><th>Action</th></tr></thead><tbody>' +
    MY_ORDERS_CACHE.map(function(o){
      return '<tr><td>'+esc(o.orderNo)+'</td>' +
        '<td>'+esc(o.customerName)+'</td>' +
        '<td>'+esc(o.orderDate)+'</td>' +
        '<td>'+o.totalItems+'</td>' +
        '<td>'+o.totalQty+'</td>' +
        '<td><span class="badge">'+esc(o.status)+'</span></td>' +
        '<td style="white-space:nowrap;">' +
          '<button class="icon-btn" title="View" onclick="viewOrderDetail_(\''+esc(o.orderId)+'\')">View</button> ' +
          '<button class="icon-btn" style="background:#25D366;border-color:#25D366;color:#fff" title="Share on WhatsApp" onclick="shareEmployeeOrderWhatsApp_(\''+esc(o.orderId)+'\')">🟢 WhatsApp</button>' +
        '</td></tr>';
    }).join('') + '</tbody></table>';
}

function viewOrderDetail_(orderId){
  const o = MY_ORDERS_CACHE.find(function(x){ return x.orderId===orderId; });
  if(!o) return;
  q('#modalHost').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal">' +
      '<div class="modal-head"><h3>'+esc(o.orderNo)+'</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
      '<div class="modal-body">' +
        '<p style="margin:0 0 10px;font-size:13.5px;">Customer: <strong>'+esc(o.customerName)+'</strong> &middot; '+esc(o.orderDate)+'</p>' +
        '<table><thead><tr><th>Product</th><th>Qty</th><th>Status</th></tr></thead><tbody>' +
          o.items.map(function(it){ return '<tr><td>'+esc(it.productName)+'</td><td>'+it.quantity+'</td><td>'+esc(it.status)+'</td></tr>'; }).join('') +
        '</tbody></table>' +
        (o.notes ? '<p style="margin:12px 0 0;font-size:13px;color:var(--text-2);">Notes: '+esc(o.notes)+'</p>' : '') +
      '</div>' +
      '<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>' +
    '</div></div>';
}

// Message MY_ORDERS_CACHE se hi banta hai - koi extra server round-trip
// nahi (Attendance card wali stuck-button problem se bachne ke liye).
function shareEmployeeOrderWhatsApp_(orderId){
  const o = MY_ORDERS_CACHE.find(function(x){ return x.orderId===orderId; });
  if(!o) return;
  let msg = 'Dear Team,\nA new order has been generated.\n\n';
  msg += '📦 ORDER DETAILS\n';
  msg += 'Order No.: '+o.orderNo+'\n';
  msg += 'Customer: '+o.customerName+'\n';
  msg += 'Order Date: '+o.orderDate+'\n';
  msg += 'Created By: '+o.employeeName+'\n\n';
  msg += '🛒 ORDER ITEMS\n';
  msg += o.items.map(function(it,i){ return '   '+(i+1)+'. '+it.productName+' — Qty: '+it.quantity; }).join('\n');
  msg += '\n\n📝 Notes: '+(o.notes || '—');
  msg += '\n\nPlease process the order accordingly.\nThank you.';
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

function openCreateOrderModal_(customerId, customerName){
  ORDER_ITEM_ROWS_ = [{ productName:'', quantity:'' }];
  q('#modalHost').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal">' +
      '<div class="modal-head"><h3>Create New Order</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
      '<div class="modal-body">' +
        '<div class="field"><label>Customer Name</label><input type="text" value="'+esc(customerName)+'" disabled></div>' +
        '<div class="field"><label>Order Date</label><input type="text" value="'+new Date().toLocaleString()+'" disabled></div>' +
        '<label style="font-size:13px;font-weight:600;display:block;margin:10px 0 6px;">Products</label>' +
        '<div id="orderItemRows"></div>' +
        '<button class="btn btn-ghost" style="margin-top:6px;" onclick="addOrderItemRow_()">+ Add Product</button>' +
      '</div>' +
      '<div class="modal-actions"><button class="btn btn-primary" id="orderSaveBtn" onclick="saveOrder_(\''+esc(customerId)+'\')">Create Order</button><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div>' +
    '</div></div>';
  paintOrderItemRows_();
}

function paintOrderItemRows_(){
  const host = q('#orderItemRows');
  if(!host) return;
  host.innerHTML = ORDER_ITEM_ROWS_.map(function(row, idx){
    return '<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;">' +
      '<input type="text" placeholder="Product name" value="'+esc(row.productName)+'" style="flex:2" oninput="ORDER_ITEM_ROWS_['+idx+'].productName=this.value">' +
      '<input type="number" placeholder="Qty" min="1" value="'+esc(row.quantity)+'" style="flex:1" oninput="ORDER_ITEM_ROWS_['+idx+'].quantity=this.value">' +
      (ORDER_ITEM_ROWS_.length>1 ? '<button class="icon-btn" title="Remove" onclick="removeOrderItemRow_('+idx+')">&times;</button>' : '') +
    '</div>';
  }).join('');
}

function addOrderItemRow_(){
  ORDER_ITEM_ROWS_.push({ productName:'', quantity:'' });
  paintOrderItemRows_();
}

function removeOrderItemRow_(idx){
  ORDER_ITEM_ROWS_.splice(idx, 1);
  paintOrderItemRows_();
}

function saveOrder_(customerId){
  const items = ORDER_ITEM_ROWS_
    .map(function(r){ return { productName: (r.productName||'').trim(), quantity: Number(r.quantity)||0 }; })
    .filter(function(r){ return r.productName && r.quantity>0; });
  if(!items.length){ showToast('Add at least one product with a quantity.', 'err'); return; }
  const btn = q('#orderSaveBtn'); btn.disabled=true; btn.textContent='Creating...';
  google.script.run
    .withSuccessHandler(function(res){
      btn.disabled=false; btn.textContent='Create Order';
      if(res && res.success){ showToast('Order '+res.orderNo+' created.', 'ok'); closeModal(); if(q('#ordersList')) loadMyOrders_(); }
      else { showToast((res && res.message) || 'Failed to create order.', 'err'); }
    })
    .withFailureHandler(function(){ btn.disabled=false; btn.textContent='Create Order'; showToast('Failed to create order.', 'err'); })
    .apiEmployeeCreateOrder(ETOKEN, customerId, items);
}
